schema_version: "0.1"
status: active

goal:
  summary: "继续 AgentLens 1.0 Alpha Hub，完成 H8 Unified Read 基础"

phase:
  type: implementation
  summary: "H1-H7 已完成并通过主 CI；当前只建立 Local Canonical + active Remote Replica 的正式只读边界，不引入 HTTPS"

scope:
  include:
    - "Remote Read 只读取每个 originNode 当前 active Generation，staged / retired 不可见"
    - "Remote Read 保留 Replication Availability，不把 omitted/redacted 转成 Local 假值"
    - "Remote Shared Identity 只暴露 Hub 重算后的状态，不信任 Node 原始 assertion"
    - "建立 Local Canonical + Remote Replica Unified Read Contract"
    - "先覆盖 LogicalSession detail 读取，Local 使用原 Canonical ID，Remote 使用 ReplicaKey"
    - "锁定 Local/Remote originEntityId 相同仍可通过 opaque publicId 唯一定位"
    - "后续在同一 Contract 上逐步补 Node / Host / Shared Project 过滤与 Projection 接入"
  exclude:
    - "HTTP / HTTPS Replication Surface"
    - "Pairing Secret、TLS、Node/Hub signature、serverProof"
    - "Node 网络 Sender / retry/backoff"
    - "Remote Web Login / Remote Control"
    - "Remote File Backup / Pull"
    - "HA、多 Hub、Federation"
    - "为了 Unified Read 改写 Local Canonical Schema 或建立第二事实源"

constraints:
  required:
    - "Unified Read 是 Projection / Surface 访问 Remote Replica 的正式边界；上层不得直接查 Hub replica 私表"
    - "Local Canonical Entity 保持现有 ID 与 Repository 语义"
    - "Remote Entity publicId 使用 H2 ReplicaKey"
    - "SharedGroupKey 只用于 Group / Filter / Aggregation，不成为 Conditional Shared 领域 FK"
    - "Remote Generation activation 前数据不得泄漏到 Unified Read"
    - "Availability 的 value/null/redacted/omitted 原因必须保留到读模型"
  forbidden:
    - "未经明确要求发布 npm 或创建 Release"
    - "在 H8 开放任何网络监听"
    - "Projection / Web 直接访问 hub_remote_replica_* 表"
    - "把 Remote Replica cast 成完整 Local Core Entity"
    - "用字符串前缀推断 Local/Remote scope"
  frozen:
    - "H1 Node Identity + Capability Composition"
    - "H2 ReplicaKey / Shared Identity / Entity Scope"
    - "H3 R1 Wire DTO / Semantic Hash / Sequence / ACK"
    - "H4 Replication Policy / History Boundary / Availability"
    - "H5 Durable Pending / Frozen Batch / Reconciliation"
    - "H6 Canonical Change Journal / deterministic Frozen Batch"
    - "H7 Remote Replica Store / Transactional Ingest / Generation activation"
    - "Local-first、单 Hub 星型拓扑、不提供 Remote Control"
  deferred:
    - action: "Replication 网络 Surface / Pairing Security"
      until: "用户重新明确要求考虑 HTTPS / 网络接入"

acceptance:
  - "Remote Read 永远排除 staged / retired Generation"
  - "Local LogicalSession 继续以原 Canonical ID 读取"
  - "Remote LogicalSession 只以 ReplicaKey 读取"
  - "Local 与 Remote 即使 originEntityId 相同也不会碰撞"
  - "Local runtimeProfileId 等 Canonical 字段通过既有 Repository 语义进入 Unified Read"
  - "Remote Availability 原样进入 Unified Read"
  - "H8 不新增网络可达面"

progress:
  current:
    - "H7 schema v10 已实现 Hub Remote Replica / Generation / Stream / Committed Batch / Shared Identity State"
    - "H7 Importer 已实现 Batch 单事务、contiguous ACK、exact retry、ReplicaKey/SharedKey/Scope/Typed Ref/Availability Hub 端重算校验"
    - "H7 G1 active -> G2 staged -> atomic activate 已有真实 SQLite 测试"
    - "H7 最终提交 e5710f006223469fec30bea59a6c4f26942e198a 已通过 AgentLens 1.0 CI 与 Windows Installer Compile"
    - "H8 已实现 active-generation Remote Read Repository，并只暴露 Hub 重算 Shared Identity State"
    - "H8 已新增 LogicalSession Unified Reader，组合 Local Canonical 与 Remote Replica publicId"
    - "已确认 Session RuntimeProfile 由 withSqliteSessionRuntimeProfiles 装饰器完整 round-trip，无需重写基础 Repository"
  next:
    - "先让 H8 LogicalSession Unified Read 三平台 CI 收绿"
    - "再补 Unified Read 的最小 query/filter 能力，优先 Node 与 LogicalSession"
    - "最后接入一个现有 Projection 作为真实消费方，验证上层不直接依赖 Replica 私表"

decisions:
  - "H8 不建立新的全局 Canonical 表；Local 继续走既有 Repository，Remote 走 active-generation Remote Read"
  - "H8 先按真实 Surface 需求扩 Entity slice，不一次性机械复制全部 17 类 Entity Reader"
  - "HTTPS / Pairing / TLS 当前明确延期，不作为 H8 前置条件"
  - "只有改变冻结长期不变量时才发起 ADR / Contract Review"

repository:
  provider: github
  branch: main
  pull_request: null
