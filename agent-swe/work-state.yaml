schema_version: "0.1"
status: active

goal:
  summary: "继续 AgentLens 1.0 Alpha Hub，进入 H7 Remote Replica Store / Transactional Ingest"

phase:
  type: implementation
  summary: "H1-H6 已完成；下一步让 Hub 在不联网的前提下事务校验并持久化 R1 Batch，建立 Remote Replica、Generation 与 Shared Identity State"

scope:
  include:
    - "新增 Hub Remote Replica Store SQLite Schema，与 Local Canonical 表物理/语义隔离"
    - "按 nodeId / generationId / ReplicaKey 持久化 Remote Entity Envelope 与 Availability"
    - "实现 active / staged / retired Remote Replica Generation 状态"
    - "事务校验 R1 Batch semantic hash、Sequence、Entity Type/Version、Typed Ref 与 Generation"
    - "Hub 重算 H2 ReplicaKey，不信任 Node claimed replicaKey"
    - "Hub 重算 Project / AssetDefinition Shared Identity assertion，持久化 Conditional Shared Membership"
    - "Remote AgentProduct Shared Root assertion 跟随 Generation staged/activate"
    - "同一 Batch exact retry 幂等；任何实体/ref/shared 校验失败整 Batch rollback"
    - "建立 Import ACK / contiguous sequence 状态，为后续 HTTP Surface 复用"
    - "覆盖两个 Node 相同 originEntityId 不碰撞、staged Generation 不进入 active state 的测试"
  exclude:
    - "真实 HTTP / HTTPS Replication Surface"
    - "Pairing Secret、TLS、Node/Hub signature、serverProof"
    - "Node 侧真正网络 Sender / retry/backoff"
    - "Unified Read / Projection / Web / CLI"
    - "Remote File Backup / Pull"
    - "HA、多 Hub、Federation、Remote Control"

constraints:
  required:
    - "Remote Replica Store 与 Local Canonical Store 同属一个 Hub SQLite boundary，但不得把 Remote omitted/redacted 塞进 Local Canonical 表"
    - "Remote Replica 的 public identity 使用 H2 ReplicaKey；Local Canonical ID 不迁移"
    - "Hub 必须从 nodeId + entityType + originEntityId 重算 ReplicaKey"
    - "Conditional Shared 只建立 Group/Membership，不改写 Remote origin identity 或领域 Ref"
    - "所有 Remote Shared Identity State 跟随 Remote Generation staged/activate；Hub Local assertion 不受 Remote Generation 控制"
    - "Batch Import 必须单事务；失败不得留下半批 Remote Replica / Shared Membership / ACK"
    - "普通 reconciliation absence 不表示删除；H7 不凭 absence 制造 Tombstone"
    - "Import 成功后才能推进 contiguous ACK"
  forbidden:
    - "未经明确要求发布 npm 或创建 Release"
    - "在 H7 提前开放网络监听"
    - "调用普通 ObservationService.commit() 重新解释 Remote Fact"
    - "把 Remote Replica cast 成完整 Local Core Entity 后写 Local Canonical Repository"
    - "静默接受 unknown entityType/entityVersion"
    - "直接相信 Node claimed ReplicaKey / claimedSharedKey"
    - "用 last-write-wins 跨 Node 合并 Conditional Shared origin"
  frozen:
    - "H1 persistent nodeId + capability-driven Composition"
    - "H2 ReplicaKey / Shared Identity / Entity Scope"
    - "H3 R1 Wire DTO / Semantic Hash / Sequence / ACK"
    - "H4 Replication Policy / History Boundary / Availability"
    - "H5 Durable Pending / Frozen Batch / Reconciliation"
    - "H6 Canonical Change Journal / fixed high-water / Replica Generation / deterministic Frozen Batch"
    - "Local-first、单 Hub 星型拓扑、不提供 Remote Control"
  deferred:
    - action: "H8+ Replication Surface / Pairing Security / Unified Read"
      until: "H7 Remote Replica Store 与 Transactional Ingest 完成并验证"

acceptance:
  - "合法 R1 Batch 可在一个 SQLite transaction 内导入 Remote Replica Store 并推进 ACK"
  - "同一 Batch exact retry 不产生重复 Remote Entity / Membership"
  - "同 sequence 不同 contentHash 拒绝且数据库无部分写入"
  - "两个 Node 即使 originEntityId 相同也映射到不同 ReplicaKey"
  - "metadata-only/redacted/omitted Availability 原样持久化，不制造 Local 假值"
  - "Project / AssetDefinition Shared assertion 由 Hub 按 H2 算法重算并验证"
  - "Remote AgentProduct assertion 与 Conditional Membership 均受 Generation staged/active 控制"
  - "G2 staged 导入不影响当前 active G1；activation 原子切换"
  - "非法 Typed Ref / unknown Entity Version / Shared mismatch 使整 Batch rollback"
  - "H7 不新增网络可达面"

progress:
  current:
    - "H1-H5 已完成 Node Identity、Replication Core/Protocol/Policy 与 Durable Outbox 基础"
    - "H6 已实现 @agent-lens/replication-node Canonical Entity Generator、依赖图、Durable Pending 映射与 deterministic Batch Builder"
    - "H6 SQLite schema v8 Canonical Change Journal 使用单调 revision，避免 occurredAt/capturedAt 作为 Bootstrap high-water 漏历史回填"
    - "H6 schema v9 持久化 stream/generation/phase/entityType revision progress，Bootstrap crash 后复用固定 high-water"
    - "H6 SessionRepository 已完整 round-trip runtimeProfileId，真实 Profile 依赖可进入复制图"
    - "H6 Batch Freezer 按 Typed Ref DAG 拓扑排序，并递归补齐初始 Pending 页之外仍未冻结的依赖"
  next:
    - "先定义最小 Remote Replica / Generation / Shared Identity SQLite schema"
    - "再实现 framework-agnostic Batch Import validation + storage transaction boundary"
    - "优先打通一个 Node Batch 的事务导入与 exact retry，再扩 Generation activation / Shared Membership"

decisions:
  - "H6 Bootstrap high-water 使用复制侧单调 Canonical Change Journal revision，不使用业务事件时间或 source canonicalSequence"
  - "Bootstrap high-water 在首个实体处理前持久化；一页 Pending 全部成功后才推进 revision"
  - "Pending -> Frozen Batch 不依赖 SQLite 返回顺序，使用 H3 Typed Ref DAG 确定性排序"
  - "大 backlog 分页通过 Open Pending dependency closure 补齐依赖，不靠放大 scanLimit 掩盖边界"
  - "Remote Replica 从 H7 开始是持久 Replication Data Plane，不成为第二 Normalize 结果或 Local Canonical Fact"
  - "只有改变冻结长期不变量时才发起 ADR / Contract Review"

repository:
  provider: github
  branch: main
  pull_request: null
