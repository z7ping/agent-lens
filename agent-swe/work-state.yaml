schema_version: "0.1"
status: active

goal:
  summary: "继续 AgentLens 1.0 Alpha Hub，下一阶段实现 H5 Durable Replication State / Outbox / Reconciliation"

phase:
  type: implementation
  summary: "H1-H4 已完成并通过三平台验证；下一步只建立 Node 侧可恢复的复制状态、Outbox 与 Canonical Reconciliation，不联网、不落 Hub Remote Replica Store"

scope:
  include:
    - "定义 Node-side Replication Relationship / Stream / Generation / Cursor / ACK 的持久状态模型"
    - "SQLite durable replication state / outbox / reconciliation watermark 的 Migration 与 Repository"
    - "Outbox Item 的 immutable sequence/batch identity/content hash 状态机"
    - "Canonical Store reconciliation 发现漏入队 upsert 的确定性机制"
    - "Cordis Event 只作为 fast-path trigger，不能成为唯一 durable enqueue 依据"
    - "Bootstrap / incremental / reconcile 三种 Outbox phase 的持久状态表达"
    - "Policy Revision / History Revision 与 Outbox Item 的冻结绑定"
    - "崩溃恢复、exact retry、ACK advance、gap prevention 与重复入队幂等测试"
  exclude:
    - "真实 HTTP / HTTPS、Pairing、TLS、Request Signature"
    - "Hub Remote Replica SQLite Schema / transactional import"
    - "真正向 Hub 发包的 Replication Client"
    - "Hub Unified Read / Projection / Web / CLI"
    - "Shared Identity Hub-side persistence / merge integration"
    - "HA、多 Hub、Federation、Remote Web、Remote Control"

constraints:
  required:
    - "实现前核对 SQLite migration / repository 现状与 Canonical commit 边界"
    - "Canonical commit 成功后即使进程在 Event / fast enqueue 前崩溃，Reconciliation 仍能补回漏项"
    - "Outbox 与 Replication Control Plane 不能进入 Canonical Observation"
    - "第一次可能发网后 sequence / batchId / semantic contentHash 必须 immutable"
    - "Policy / History 变更只影响尚未冻结的生成；已冻结 Outbox Item 不得就地改写"
    - "H5 不改变 Local-first：复制状态损坏或暂停不能阻塞 Canonical Capture"
  forbidden:
    - "未经明确要求发布 npm 或创建 Release"
    - "在 H5 提前实现真实网络、Pairing、Remote Import 或 Unified Read"
    - "只依赖 Cordis Event 写 Outbox"
    - "通过扫描缺失来推断删除；删除必须等待后续 durable Tombstone 机制"
    - "把 Projection 或 Source Checkpoint 当成复制事实源"
  frozen:
    - "H1 persistent nodeId + capability-driven Composition"
    - "H2 ReplicaKey / Shared Identity / Entity Scope"
    - "H3 R1 Wire DTO / Semantic Hash / Sequence / ACK 语义"
    - "H4 Replication Policy / History Boundary / fail-closed Field Contract"
    - "Local-first、单 Hub 星型拓扑、不提供 Remote Control"
  deferred:
    - action: "H6+ Hub Remote Store / transactional ingest / security transport / unified read"
      until: "H5 Durable Replication State / Outbox / Reconciliation 完成并验证"

acceptance:
  - "Replication durable state 可在 Daemon 重启后恢复 stream/generation/next sequence/ack 状态"
  - "同一逻辑待复制事实不会因重复 fast-path / reconciliation 产生多个未决 Outbox Item"
  - "Canonical commit 后模拟 fast enqueue 丢失时，reconciliation 能补出 Outbox Item"
  - "已冻结 sequence 的 batch identity / content hash 不会被 Policy/History 变更就地修改"
  - "ACK 只能单调推进，不能跨 gap"
  - "exact retry 能重新取得同一 sequence / content hash 的冻结 Outbox Item"
  - "reconciliation 不依据 row absence 生成删除"
  - "H5 不引入 Replication HTTP Server/Client、Pairing/TLS 或 Hub Remote Store"

progress:
  current:
    - "H1 已实现 persistent Node Identity、Capability Profile 与 ctx.node"
    - "H2 已实现 Entity Scope、ReplicaKey / SharedKey、Portable Identity、Shared Membership"
    - "H3 已实现 @agent-lens/protocol/replication：R1 DTO、Typed Ref、Availability、Handshake compatibility、Semantic Hash、Sequence/ACK"
    - "H4 已实现 @agent-lens/core/replication：metadata-only/redacted/full、include-existing/from-now、Minimum Dependency Shape、credential/path protection 与 policy/history transition"
    - "H4 出站变换默认 fail-closed：未登记字段 omitted(policy)，not-replicated Entity 直接拒绝"
    - "H4 最终候选 dad21f5cba00011ef37d25619de9e3fbbc6d2ccd 已通过 Linux/macOS/Windows 三平台主 CI"
  next:
    - "先核对 storage-sqlite migration/repository 与 Canonical commit 事务边界"
    - "再定义最小 durable schema / repository / state machine 和 crash-recovery 测试"

decisions:
  - "Capture Policy、Replication Policy、Wire Protocol、Durable Replication State 保持四层边界，不互相充当事实源"
  - "Cordis Event 只做低延迟 fast path；Canonical Reconciliation 是漏项修复的 durable safety net"
  - "H5 只生成/保存待发送状态，不实现网络发送"
  - "只有改变冻结长期不变量时才发起 ADR / Contract Review"

repository:
  provider: github
  branch: main
  pull_request: null
