schema_version: "0.1"
status: active

goal:
  summary: "继续 AgentLens 1.0 Alpha Hub，完成 H10 loopback Surface + Web 多机任务复盘"

phase:
  type: implementation
  summary: "H1-H9 已完成；当前把 H9 Availability-aware Hub Review 接到既有本机 HTTP/Web，不引入 Replication 网络或 HTTPS"

scope:
  include:
    - "在现有 127.0.0.1 Local Surface 增加独立 Hub Review 只读入口"
    - "旧 /api/v1/review 与 Standalone/Local Review 行为保持不变"
    - "Web 任务复盘支持识别 Local Canonical ID 与 Remote ReplicaKey opaque publicId"
    - "Remote payload redacted / omitted(policy/history-boundary/dependency-minimized) 显式显示不可用原因"
    - "Remote 会话/Observation 只读取 active Generation"
    - "为 Hub Review 增加最小 Surface/Web 回归门禁"
  exclude:
    - "Node -> Hub HTTP/HTTPS Replication Transport"
    - "Pairing Secret、TLS、Node/Hub signature、serverProof"
    - "Node Sender / retry/backoff 网络调度"
    - "Remote Web Login / Remote Control"
    - "Remote File Backup / Pull"
    - "HA、多 Hub、Federation"
    - "一次性把全部 Overview/Usage/Facet Projection 改成多机"

constraints:
  required:
    - "Surface 继续只绑定 127.0.0.1"
    - "Hub Review Surface 只能消费 H9 HubReviewProjection / Core Unified Read，不直接查询 Hub Replica 私表"
    - "Web 不得把 redacted / omitted 转成空正文"
    - "Remote publicId / references 继续保持 opaque，不把 originEntityId 作为路由 ID"
    - "Local 任务复盘现有契约与 UI 不回归"
  forbidden:
    - "未经明确要求发布 npm 或创建 Release"
    - "开放任何外网/LAN Replication 监听"
    - "修改 AGENT_LENS_HTTP_HOST 为非 loopback"
    - "把 Hub Review 强行塞进旧 Local Review DTO"
    - "用 origin ID 作为 Remote 对外标识"
  frozen:
    - "H1-H8 Hub Runtime/Replication/Replica/Unified Read 基础"
    - "H9 Availability-aware Hub Review DTO + Projection + Runtime Service"
    - "Local-first、单 Hub 星型拓扑、不提供 Remote Control"
  deferred:
    - action: "Replication 网络 Surface / Pairing Security"
      until: "用户重新明确要求考虑 HTTPS / 网络接入"

acceptance:
  - "本机 loopback API 可通过 ReplicaKey 获取 Remote Hub Review detail"
  - "metadata-only Remote message 显示正文未同步而不是空消息"
  - "redacted 与 omitted 的 UI 状态可区分"
  - "旧 Local Review API/UI 无行为回归"
  - "H10 不增加新的网络可达面"

progress:
  current:
    - "H9 新增独立 HubReadAvailability / HubReviewDetail DTO，不修改旧 Local Review DTO"
    - "H9 HubReviewProjection 只消费 Core Unified Read Contract，保留 value/null/redacted/omitted 语义"
    - "SQLite Storage 已提供 ctx.unifiedRead，HTTP Runtime 已装配 ctx.hubReview"
    - "H9 已锁定 omitted(policy) 不得伪造成空字符串/空对象，Remote references 仅使用 opaque publicId"
    - "H9 Runtime 装配已通过 Linux / macOS / Windows 三平台主 CI，包括 Windows Desktop package、Smoke、Hook Dispatcher 与 npm lifecycle"
  next:
    - "新增独立 loopback Hub Review GET 路由，不修改旧 /api/v1/review"
    - "给 Web ClientModel 增加 Hub Review detail 读取"
    - "任务复盘渲染 Availability 状态"
    - "跑 Surface/Web/三平台主 CI 后再进入其他多机 Projection"

decisions:
  - "H10 复用现有 loopback Local HTTP，不把它视为 Replication Transport"
  - "Hub Review 使用独立协议路径，先不统一旧 Local Review DTO"
  - "HTTPS / Pairing / TLS 继续延期"
  - "只有改变冻结长期不变量时才发起 ADR / Contract Review"

repository:
  provider: github
  branch: main
  pull_request: null
