schema_version: "0.1"
status: active

goal:
  summary: "完成 AgentLens 1.0 Alpha Hub 文档收口与架构冻结，为下一阶段 H1 实现准备"

phase:
  type: verification
  summary: "Hub 长期架构已确定，当前只做文档减法治理、一致性检查与实现前冻结"

scope:
  include:
    - "Hub 长期设计、R1 协议、安全与运维文档收口"
    - "删除重复的 Hub Contract / Index / UX / Test / Plan 文档"
    - "同步 ARCHITECTURE、IMPLEMENTATION-STATUS、AGENTS 与当前工作状态"
  exclude:
    - "实现 Hub 功能代码"
    - "新增 Hub 架构概念或继续过度设计"
    - "HA、多 Hub、Federation、Remote Web、Remote Control 等 Alpha 外能力"

constraints:
  required:
    - "同一长期事实只保留一个主要权威来源，其他位置只做链接或摘要"
    - "精确 Wire / Schema 在实现后迁移到代码或标准 Schema 作为权威来源"
    - "写入前重新确认 main 最新状态"
  forbidden:
    - "未经明确要求发布 npm 或创建 Release"
    - "今天开始 Hub 功能实现"
    - "为文档完整性继续机械增加 Markdown 文件"
  frozen:
    - "ADR-0007 的 Local-first、单 Hub 星型拓扑、Node Identity、Replica/Shared Identity、Policy/History、Replica Storage、Security 核心边界"
    - "Hub 与 Node 使用同一 AgentLens Runtime / Cordis 组合根"
    - "Remote Replica 不伪造 Local Canonical Fact，不提供 Remote Control"
  deferred:
    - action: "H1 Node Identity + Capability Composition 实现"
      until: "Hub 文档减法治理和最终一致性检查完成"

acceptance:
  - "Hub 长期专项文档收敛为少量单一职责权威来源"
  - "不存在指向已删除 Hub 文档的有效引用"
  - "ARCHITECTURE、IMPLEMENTATION-STATUS、AGENTS 与 Hub 冻结边界一致"
  - "Hermes / OpenCode 当前 Runtime 状态不再被旧架构说明误写为未实现"
  - "本轮不包含任何 Hub 功能代码"

progress:
  current:
    - "正在把 11 份 Hub 专项 Markdown 收敛为 HUB-DESIGN / HUB-REPLICATION-PROTOCOL / HUB-PAIRING-SECURITY / HUB-OPERATIONS + ADR-0007"
  next:
    - "删除已被合并的旧 Hub 文档并修正引用"
    - "完成全仓文档一致性检查"
    - "下一阶段从 H1 Node Identity + Capability Composition 开始实现"

decisions:
  - "Hub Alpha 不再继续扩设计，新增结构性问题才重新发起 ADR / Contract Review"
  - "实施计划与测试清单不再作为长期 Markdown；当前下一步进入 Work State，质量门禁最终进入实际测试代码"

repository:
  provider: github
  branch: main
  pull_request: null
