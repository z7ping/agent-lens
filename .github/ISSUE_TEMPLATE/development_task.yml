name: 开发任务
description: 创建目标和验收标准已经明确的实施任务
title: "[任务] "
body:
  - type: input
    id: parent
    attributes:
      label: 上级 Issue 或 RFC
      placeholder: 例如 #123 或公开设计讨论链接
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 用几句话说明要解决的问题和完成后的结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 实施范围
      description: 只列本次需要完成的主要改动。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 保留必要的可验证检查项即可。
      placeholder: |
        - [ ] ……
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 可选；仅填写必要的依赖、风险或链接。
