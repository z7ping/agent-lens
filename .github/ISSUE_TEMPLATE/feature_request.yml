name: 功能建议
description: 描述希望 AgentLens 解决的用户问题
title: "[功能] "
body:
  - type: markdown
    attributes:
      value: |
        请简要描述用户问题和期望结果。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 用几句话说明现在遇到的困难。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 功能完成后，用户应该能做什么？
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 涉及的 Agent 或数据源
      placeholder: 例如 Codex、Claude Code，或全部来源
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出 1 至 3 条可验证结果。
      placeholder: |
        - [ ] ……
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过重复 Issue。
          required: true
