name: 功能建议
description: 描述希望 AgentLens 解决的用户问题
title: "[功能] "
body:
  - type: markdown
    attributes:
      value: |
        请优先描述用户问题和期望结果，而不是只给出界面或技术实现。
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 现在遇到了什么困难？谁会受到影响？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 功能完成后，用户应该能够回答什么问题或完成什么工作？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 使用场景与证据
      description: 提供典型任务、频率、现有替代方式或相关日志结构。
  - type: input
    id: source
    attributes:
      label: 涉及的 Agent 或数据源
      placeholder: 例如 Codex、Claude Code，或全部来源
  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 说明本次应该做什么，以及可以明确不做什么。
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过重复 Issue。
          required: true
        - label: 我理解不同 Agent 的可观测能力可能不同。
          required: true
