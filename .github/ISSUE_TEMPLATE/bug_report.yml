name: 缺陷报告
description: 报告可以稳定复现的错误或异常行为
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        请简要说明问题，并删除提示词、Token、真实路径等敏感信息。
  - type: input
    id: version
    attributes:
      label: AgentLens 版本
      placeholder: 例如 0.3.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 涉及的 Agent 或数据源
      placeholder: 例如 Codex、Claude Code、Hermes、Pi
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 用几句话说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行……
        2. 打开……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 请先移除凭据、提示词、源代码和可识别本机的信息。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已经搜索过重复 Issue。
          required: true
        - label: 我已经移除凭据、提示词和其他敏感信息。
          required: true
