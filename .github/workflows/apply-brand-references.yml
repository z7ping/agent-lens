name: Apply AgentLens brand references

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-brand-references.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add brand gate to main CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci-1.0.yml')
          text = path.read_text(encoding='utf-8')
          if 'Verify brand assets' not in text:
              needle = "      - name: Verify Web presentation convergence\n        run: npm run check:web-presentation\n\n"
              if needle not in text:
                  raise SystemExit('CI insertion point not found')
              text = text.replace(
                  needle,
                  needle + "      - name: Verify brand assets\n        run: npm run check:brand-assets\n\n",
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit CI gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci-1.0.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "将品牌图标检查接入 CI"
          git push
