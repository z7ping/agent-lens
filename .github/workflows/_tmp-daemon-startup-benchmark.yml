name: 临时 Daemon 启动基准

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-daemon-startup-benchmark.yml'

permissions:
  contents: read

jobs:
  daemon-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/performance/daemon-startup-benchmark.ts --sessions=1000 --observations-per-session=100 --timeout-ms=30000

# trigger s
