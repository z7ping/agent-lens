name: 临时 Projection 启动负载收口

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-apply-projection-startup.yml'
      - '.github/_tmp_projection_startup_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: 应用修改
        run: python .github/_tmp_projection_startup_patch.py
      - name: 类型检查
        run: npm run typecheck
      - name: 关键测试
        run: |
          npm run test --workspace @agent-lens/daemon
          npm run test --workspace @agent-lens/projection-session
          npm run test --workspace @agent-lens/core-services
          npm run test --workspace @agent-lens/storage-sqlite
      - name: 提交并清理临时脚手架
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/_tmp_projection_startup_patch.py .github/workflows/_tmp-apply-projection-startup.yml
          git add packages/core/src/services/index.ts packages/core-services/src/index.ts packages/storage-sqlite/src/session-summaries.ts packages/projection-session/src/summary-plugin.ts apps/daemon/src/main.ts apps/daemon/src/projection-readiness.ts apps/daemon/src/projection-readiness.test.ts
          git diff --cached --check
          git commit -m 'perf: 避免干净启动重复重建会话摘要'
          git push origin HEAD:main
