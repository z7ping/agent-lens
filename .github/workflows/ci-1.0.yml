name: AgentLens 1.0 CI

on:
  push:
    branches:
      - main
      - refactor/1.0-foundation
      - feature/asset-backup-insights
  pull_request:
    branches:
      - main
      - codex/fix-runtime-projection-stability

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Verify npm package contents
        run: npm pack --dry-run
