name: AgentLens 1.0 CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify brand assets
        run: npm run check:brand-assets

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Prepare Windows desktop runtime
        if: runner.os == 'Windows'
        run: npm run desktop:prepare

      - name: Build Windows desktop package
        if: runner.os == 'Windows'
        run: npm run dist:win --workspace @agent-lens/desktop

      - name: Smoke packaged Windows desktop
        if: runner.os == 'Windows'
        run: node scripts/smoke-desktop-runtime.mjs release/windows/win-unpacked/AgentLens.exe

      - name: Verify Windows shared Hook dispatcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/test-hook-dispatcher-windows.ps1

      - name: Verify Windows npm lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/test-npm-lifecycle-windows.ps1

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Verify npm package contents
        run: npm run smoke:npm-package
