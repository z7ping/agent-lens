name: AgentLens 手动检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # npm pack 的 prepack 已执行展示、品牌、桌面检查与分发构建。
      - name: Verify npm package contents
        run: npm run smoke:npm-package

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Verify Windows shared Hook dispatcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/test-hook-dispatcher-windows.ps1

      - name: Verify Windows npm lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/test-npm-lifecycle-windows.ps1

      # electron-builder rebuilds the hoisted better-sqlite3 binary for Electron in-place.
      # Keep every plain-Node distribution/lifecycle check above this boundary.
      - name: Prepare Windows desktop runtime
        if: runner.os == 'Windows'
        run: npm run desktop:prepare

      - name: Build Windows desktop package
        if: runner.os == 'Windows'
        run: npm run dist:win --workspace @agent-lens/desktop

      - name: Smoke packaged Windows desktop
        if: runner.os == 'Windows'
        run: node scripts/smoke-desktop-runtime.mjs release/windows/win-unpacked/AgentLens.exe
