name: 临时修复 alpha.3 分页 SQL 转义并复验

on:
  push:
    branches: [feature/alpha3-task-center]
    paths:
      - '.github/workflows/_tmp-alpha3-request-pagination-fix-v4.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/alpha3-task-center
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.0'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 应用补丁并修正 SQL 字符串
        shell: bash
        run: |
          python <<'RUN'
          from pathlib import Path
          import subprocess, textwrap
          workflow = Path('.github/workflows/_tmp-alpha3-request-pagination-fix.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          exec(compile(textwrap.dedent(workflow[start:end]), '<patch>', 'exec'), {})

          path = Path('packages/storage-sqlite/src/session-summaries.ts')
          text = path.read_text(encoding='utf-8')
          bad = "conditions.push('EXISTS (SELECT 1 FROM json_each(COALESCE(summary.source_ids_json, '[]')) AS source WHERE source.value = ?)')"
          good = '''conditions.push("EXISTS (SELECT 1 FROM json_each(COALESCE(summary.source_ids_json, '[]')) AS source WHERE source.value = ?)")'''
          if bad not in text:
              raise SystemExit('expected SQL quoting target not found')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')

          for name in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              file = Path(name)
              if not file.is_file():
                  continue
              try:
                  value = file.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              file.write_text('\n'.join(line.rstrip(' \t') for line in value.split('\n')), encoding='utf-8')
          RUN
      - name: 检查差异
        run: |
          git diff --check
          node scripts/check-task-center-performance-contract.mjs
      - name: 类型检查
        run: npm run typecheck
      - name: 关键测试
        run: |
          npm run test --workspace @agent-lens/storage-sqlite
          npm run test --workspace @agent-lens/projection-review
          npm run test --workspace @agent-lens/surface-http
          npm run test --workspace @agent-lens/web
          npm run check:web-presentation
      - name: 提交修复
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/_tmp-alpha3-request-pagination-fix.yml \
            .github/workflows/_tmp-alpha3-request-pagination-fix-v2.yml \
            .github/workflows/_tmp-alpha3-request-pagination-diagnose.yml \
            .github/workflows/_tmp-alpha3-request-pagination-fix-v4.yml
          git add packages scripts package.json
          git diff --cached --check
          git commit -m 'perf: 收口任务中心请求与列表分页'
          git push origin HEAD:feature/alpha3-task-center
