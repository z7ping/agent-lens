name: npm Package Smoke

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Pack, install and run npm artifact
        run: npm run smoke:npm-package

  registry-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org
