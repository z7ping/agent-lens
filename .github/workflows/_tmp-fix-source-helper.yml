name: 临时修正 Source 性能执行器

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-fix-source-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 修正 Python shell 声明
        shell: bash
        run: |
          sed -i 's/shell: python$/shell: python {0}/' .github/workflows/_tmp-source-scan-perf-patch.yml
          git config user.name 'agentlens-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/_tmp-source-scan-perf-patch.yml
          git commit -m '临时：修正 Source 性能执行器'
          git push origin HEAD:main
