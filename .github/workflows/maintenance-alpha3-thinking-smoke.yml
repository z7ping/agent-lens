name: One-off Alpha3 Thinking Smoke

on:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - .github/workflows/maintenance-alpha3-thinking-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require visible Thinking in Task Center smoke
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/acceptance/task-center-desktop.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const from = "  if (p.thinkingFont > 0 && p.thinkingFont < 13) errors.push(`Thinking 正文字号过小：${p.thinkingFont}px`)"
          const to = `${from}\n  if (value.thinkingCount < 1) errors.push('Codex 可见 Thinking 未进入 Task Surface')`
          const count = source.split(from).length - 1
          if (count !== 1) throw new Error(`expected one Thinking font assertion, found ${count}`)
          source = source.replace(from, to)
          fs.writeFileSync(path, source)
          NODE
          git diff --check
      - name: Commit Thinking smoke assertion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acceptance/task-center-desktop.mjs
          git commit -m 'test(alpha3): 验证 Codex Thinking 真实展示链路'
          git push origin HEAD:${GITHUB_REF_NAME}
