name: macOS Desktop

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：补发到已有 Release，例如 v1.0.0-alpha.5'
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos_policy:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - name: 确定 macOS 签名模式
        id: mode
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signed=false
          if [[ -n "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID$APPLE_API_KEY_P8$APPLE_API_KEY_ID$APPLE_API_ISSUER" ]]; then
            if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]] || { [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]] && [[ -z "$APPLE_API_KEY_P8" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; }; then
              echo 'macOS 签名或公证凭据不完整，请补全或全部移除。' >&2
              exit 1
            fi
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: 标注未签名 macOS 安装包
        if: steps.mode.outputs.signed == 'false' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          if ! grep -q '<!-- macos-unsigned-notice -->' "$RUNNER_TEMP/release-body.md"; then
            printf '%s\n\n' '<!-- macos-unsigned-notice -->' '> macOS 安装包未经 Apple Developer ID 签名或公证，首次打开时可能受到 Gatekeeper 阻止或显示安全提示。请从本项目的 GitHub Release 下载，并使用对应的 SHA256SUMS-macos 文件核对。' > "$RUNNER_TEMP/release-notes.md"
            cat "$RUNNER_TEMP/release-body.md" >> "$RUNNER_TEMP/release-notes.md"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  macos:
    needs: macos_policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            build_script: desktop:mac:arm64
            release_script: desktop:mac:arm64:release
          - arch: x64
            runner: macos-15-intel
            build_script: desktop:mac:x64
            release_script: desktop:mac:x64:release
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify manual release exists
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs

      - name: Materialize App Store Connect API key
        if: needs.macos_policy.outputs.signed == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            KEY_PATH="$RUNNER_TEMP/agentlens-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Require macOS release signing and notarization credentials
        if: needs.macos_policy.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/check-release-signing.mjs macos

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build unsigned macOS desktop
        if: needs.macos_policy.outputs.signed != 'true'
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS desktop
        if: needs.macos_policy.outputs.signed == 'true'
        run: npm run ${{ matrix.release_script }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization
        if: needs.macos_policy.outputs.signed == 'true'
        shell: bash
        run: |
          APP="$(find release/macos -type d -path '*/AgentLens.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo '没有找到 macOS AgentLens.app' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/macos -type f -path '*/AgentLens.app/Contents/MacOS/AgentLens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 macOS AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/macos
          shopt -s nullglob
          files=(AgentLens-*-macOS-${{ matrix.arch }}.dmg AgentLens-*-macOS-${{ matrix.arch }}.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 macOS ${{ matrix.arch }} 发布产物" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-lens-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            release/macos/AgentLens-*-macOS-${{ matrix.arch }}.dmg
            release/macos/AgentLens-*-macOS-${{ matrix.arch }}.zip
            release/macos/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Attach macOS artifacts to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/macos/AgentLens-*-macOS-${{ matrix.arch }}.dmg release/macos/AgentLens-*-macOS-${{ matrix.arch }}.zip release/macos/SHA256SUMS-macos-${{ matrix.arch }}.txt --clobber

  macos_notice_complete:
    needs: [macos_policy, macos]
    if: needs.macos_policy.outputs.signed == 'false' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    steps:
      - name: 更新 macOS 安装包状态
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          sed 's/本版本的 macOS 安装包尚待补发；计划提供的安装包未经/本版本的 macOS 安装包未经/' "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-notes.md"
          if ! cmp -s "$RUNNER_TEMP/release-body.md" "$RUNNER_TEMP/release-notes.md"; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
