name: AgentLens temporary attribution patch

on:
  push:
    branches:
      - fix/alpha3-codex-provenance-activity
    paths:
      - .github/workflows/_agentlens_code_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alpha3-codex-provenance-activity
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Patch attribution code
        shell: python
        run: |
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str, *, offset: int = 0):
              left = text.find(start, offset)
              if left < 0:
                  raise SystemExit(f'start marker not found: {start}')
              right = text.find(end, left + len(start))
              if right < 0:
                  raise SystemExit(f'end marker not found: {end}')
              return text[:left] + replacement + text[right:]

          projection = Path('packages/projection-review/src/projection.ts')
          text = projection.read_text(encoding='utf-8')
          expected = 0
          old = "await this.backwardInteractionPage(logicalSessionId, { ...query, direction: 'backward' }, 'latest', summary.interactionCount)"
          if old in text:
              text = text.replace(old, "await this.backwardInteractionPage(logicalSessionId, { ...query, direction: 'backward' }, 'latest', descriptors.length)", 1)
              expected += 1
          old = "await this.backwardInteractionPage(logicalSessionId, query, 'all', summary.interactionCount)"
          if old in text:
              text = text.replace(old, "await this.backwardInteractionPage(logicalSessionId, query, 'all', descriptors.length)", 1)
              expected += 1
          if expected != 2:
              raise SystemExit(f'projection replacements={expected}, expected=2')
          projection.write_text(text, encoding='utf-8')

          summary = Path('packages/storage-sqlite/src/session-summaries.ts')
          text = summary.read_text(encoding='utf-8')
          relationship_helpers = '''function parentSessionSql(sessionIdSql: string): string {
            return `(
              SELECT relation.from_session_id
              FROM session_relationships AS relation
              WHERE relation.to_session_id = ${sessionIdSql}
                AND relation.type IN ('task-root', 'internal-review', 'subagent', 'branch-task', 'fork', 'related')
              ORDER BY CASE relation.type
                WHEN 'task-root' THEN 0
                WHEN 'internal-review' THEN 1
                WHEN 'subagent' THEN 2
                WHEN 'branch-task' THEN 3
                WHEN 'fork' THEN 4
                ELSE 5 END,
                relation.id
              LIMIT 1
            )`
          }

          function internalReviewCountSql(sessionIdSql: string): string {
            return `(
              SELECT COUNT(DISTINCT review_relation.to_session_id)
              FROM session_relationships AS review_relation
              WHERE review_relation.from_session_id = ${sessionIdSql}
                AND (
                  review_relation.type = 'internal-review'
                  OR (
                    review_relation.type = 'task-root'
                    AND EXISTS (
                      SELECT 1
                      FROM observations AS review_activity
                      WHERE review_activity.logical_session_id = review_relation.to_session_id
                        AND review_activity.kind = 'session.lifecycle'
                        AND json_extract(review_activity.payload_json, '$.sessionActivity') = 'internal-review'
                    )
                  )
                )
            )`
          }

          '''
          text = replace_between(text, 'function parentSessionSql', 'function legacyQuerySql', relationship_helpers + 'function legacyQuerySql')
          summary.write_text(text, encoding='utf-8')

          review = Path('packages/web/src/features/ReviewPage.tsx')
          text = review.read_text(encoding='utf-8')

          title_replacement = '''function normalizedSessionTitle(value: string | undefined): string {
            return value?.replace(/\\s+/g, ' ').trim() ?? ''
          }

          function compactTitle(value: string | undefined, max = 92, fallback = '未命名会话'): string {
            const text = normalizedSessionTitle(value)
            if (!text) return fallback
            return text.length > max ? `${text.slice(0, max)}…` : text
          }

          function sessionTitle(candidates: Array<string | undefined>, fallback: string, max = 92): string {
            const value = candidates.map(normalizedSessionTitle).find(Boolean)
            return compactTitle(value, max, fallback)
          }

          '''
          text = replace_between(text, 'const injectedTitlePatterns = [', 'function hubAvailabilityString', title_replacement + 'function hubAvailabilityString')

          old_label = "if (node.kind === 'context.injected') return '系统注入上下文'"
          if old_label not in text:
              raise SystemExit('context injected label line not found')
          text = text.replace(old_label, "if (node.kind === 'context.injected') return stringValue(payload, 'label') || '系统注入上下文'", 1)

          summary_start = text.find('function sourceEventSummary')
          if summary_start < 0:
              raise SystemExit('sourceEventSummary not found')
          context_start = text.find("  if (node.kind === 'context.injected') {", summary_start)
          lifecycle_start = text.find("  if (node.kind === 'session.lifecycle') {", context_start)
          if context_start < 0 or lifecycle_start < 0:
              raise SystemExit('context summary markers not found')
          context_replacement = '''  if (node.kind === 'context.injected') {
            const role = stringValue(payload, 'role')
            const label = stringValue(payload, 'label')
            const kind = stringValue(payload, 'injectedKind')
            return [label || kind, role].filter(Boolean).join(' · ') || '系统注入'
          }
          '''
          text = text[:context_start] + context_replacement + text[lifecycle_start:]

          markdown_replacement = '''function MarkdownSurface({ text }: { text: string }) {
            const [view, setView] = useState<'rendered' | 'source'>('rendered')
            return <div className="markdown-message" data-view={view}>
              <div className="markdown-surface">
                {view === 'rendered' ? <MarkdownContent text={text}/> : <CopyableCodeBlock className="markdown-source" copyValue={text}>{text}</CopyableCodeBlock>}
              </div>
              <div className="markdown-message-actions">
                <button title={view === 'rendered' ? '查看 Markdown 源码' : '返回渲染结果'} onClick={() => setView(value => value === 'rendered' ? 'source' : 'rendered')}>{view === 'rendered' ? '源码' : '渲染'}</button>
              </div>
            </div>
          }

          '''
          text = replace_between(text, 'function MarkdownSurface', 'function MessageBubble', markdown_replacement + 'function MessageBubble')

          event_replacement = '''function systemEventExpansionKey(eventId: string): string {
            return `agent-lens:review:system-event:${eventId}:expanded`
          }

          function readSystemEventExpanded(eventId: string): boolean {
            try { return window.localStorage.getItem(systemEventExpansionKey(eventId)) !== 'false' } catch { return true }
          }

          function SystemEventTrack({ event, inspect }: { event: ReviewEventNodeDto; inspect(node: ReviewNodeDto): void }) {
            const payload = payloadRecord(event.payload)
            const body = stringValue(payload, 'text')
            const injectedKind = stringValue(payload, 'injectedKind') || 'application'
            const [expanded, setExpanded] = useState(() => readSystemEventExpanded(event.id))
            const toggle = () => setExpanded(value => {
              const next = !value
              try { window.localStorage.setItem(systemEventExpansionKey(event.id), String(next)) } catch {}
              return next
            })
            return <section className="task-system-event-track" data-kind={injectedKind} data-expanded={expanded ? 'true' : 'false'}>
              <header className="task-system-event-head">
                <button className="task-system-event-toggle" aria-expanded={expanded} onClick={toggle}>
                  <UiIcon name={expanded ? 'chevron-down' : 'chevron-right'} size={13}/>
                  <span>{sourceEventLabel(event)}</span>
                </button>
                <EvidenceBadges evidence={event.evidence} compact/>
                <span className="task-system-event-meta"><span>{agentLabel(event.sourceId)}</span><time>{formatClock(event.at)}</time></span>
                <button className="task-system-event-inspect" onClick={() => inspect(event)}>源码 / Evidence</button>
              </header>
              {expanded && (body
                ? <CopyableCodeBlock className="task-system-event-body" copyValue={body}>{body}</CopyableCodeBlock>
                : <div className="task-system-event-empty">当前来源只记录了注入类型，没有可显示正文；可查看源码与 Evidence。</div>)}
            </section>
          }

          function EventRow({ event, inspect }: { event: ReviewEventNodeDto; inspect(node: ReviewNodeDto): void }) {
            if (event.kind === 'context.injected') return <SystemEventTrack event={event} inspect={inspect}/>
            return <TaskEvent
              model={{
                id: event.id,
                label: sourceEventLabel(event),
                category: event.category,
                summary: sourceEventSummary(event),
                sourceLabel: agentLabel(event.sourceId),
                time: formatClock(event.at),
                nativeId: event.nativeEventId,
                parentId: event.nativeParentEventId ?? event.parentObservationId,
              }}
              meta={<EvidenceBadges evidence={event.evidence} compact/>}
              onInspect={() => inspect(event)}
            />
          }

          '''
          text = replace_between(text, 'function EventRow', 'function RawEventGroup', event_replacement + 'function RawEventGroup')
          review.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: |
          npm test --workspace @agent-lens/source-codex
          npm test --workspace @agent-lens/storage-sqlite
          npm test --workspace @agent-lens/projection-review
      - name: Web presentation checks
        run: |
          npm run check:web-presentation
          npm run build:web
      - name: Commit verified patch
        run: |
          git config user.name "agent-lens-bot"
          git config user.email "agent-lens-bot@users.noreply.github.com"
          git add packages/projection-review/src/projection.ts packages/storage-sqlite/src/session-summaries.ts packages/web/src/features/ReviewPage.tsx
          git diff --cached --check
          git commit -m "fix: 收口系统活动正文与根任务审查统计"
          git push origin HEAD:fix/alpha3-codex-provenance-activity
