name: One-off Alpha3 Screenshot Stability

on:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - .github/workflows/maintenance-alpha3-screenshot-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Harden Chromium screenshot evidence capture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/acceptance/task-center-desktop.mjs'
          let source = fs.readFileSync(path, 'utf8')

          function replaceExact(from, to, expected = 1) {
            const count = source.split(from).length - 1
            if (count !== expected) throw new Error(`expected ${expected} occurrence(s), found ${count}: ${from.slice(0, 120)}`)
            source = source.replaceAll(from, to)
          }

          replaceExact(
            `async function applyViewport(win, viewport) {\n  ensureDebugger(win)`,
            `async function applyViewport(win, viewport) {\n  // 同时锁定真实 BrowserWindow content size，给 Windows hidden-window 截图提供可靠兜底。\n  win.setContentSize(viewport.width, viewport.height)\n  ensureDebugger(win)`,
          )

          replaceExact(
            `async function captureViewport(win, viewport, theme) {\n  ensureDebugger(win)\n  const result = await withTimeout(win.webContents.debugger.sendCommand('Page.captureScreenshot', {\n    format: 'png',\n    fromSurface: true,\n    captureBeyondViewport: false,\n  }), 8_000, \`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} 截图\`)\n  if (!result?.data) fail(\`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} 截图数据为空\`)\n  return Buffer.from(result.data, 'base64')\n}`,
            `async function captureViewport(win, viewport, theme) {\n  ensureDebugger(win)\n  try {\n    const result = await withTimeout(win.webContents.debugger.sendCommand('Page.captureScreenshot', {\n      format: 'png',\n      fromSurface: true,\n      captureBeyondViewport: false,\n    }), 10_000, \`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} CDP 截图\`)\n    if (!result?.data) fail(\`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} CDP 截图数据为空\`)\n    return Buffer.from(result.data, 'base64')\n  } catch (error) {\n    // Windows hosted runner 上 hidden BrowserWindow 的第二次 Page.captureScreenshot 偶发悬挂。\n    // 先撤销卡住的 debugger session，再用已锁定 content size 的 Electron capturePage 兜底；\n    // 几何/滚动/字号等验收仍来自真实 Renderer，兜底只影响证据截图传输。\n    safeDetachDebugger(win)\n    await delay(80)\n    const image = await withTimeout(win.webContents.capturePage(), 8_000, \`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} Electron 截图兜底\`)\n    const size = image.getSize()\n    if (image.isEmpty() || Math.abs(size.width - viewport.width) > 2 || Math.abs(size.height - viewport.height) > 2) {\n      throw new Error(\`${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'} 截图失败；CDP=${'${error instanceof Error ? error.message : String(error)}'}；fallback=${'${size.width}'}×${'${size.height}'}\`)\n    }\n    console.warn(\`CDP 截图超时，已使用 Electron capturePage 兜底：${'${viewport.width}'}×${'${viewport.height}'} ${'${theme}'}\`)\n    return image.toPNG()\n  }\n}`,
          )

          fs.writeFileSync(path, source)
          NODE
          git diff --check
      - name: Commit screenshot stability fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acceptance/task-center-desktop.mjs
          git commit -m 'fix(alpha3): 提升 Windows 截图门禁稳定性'
          git push origin HEAD:${GITHUB_REF_NAME}
