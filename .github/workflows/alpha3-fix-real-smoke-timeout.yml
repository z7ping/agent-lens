name: Alpha.3 Fix Real Smoke Timeout

on:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - .github/workflows/alpha3-fix-real-smoke-timeout.yml

permissions:
  contents: write

jobs:
  patch-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/1.0.0-alpha.3-task-surface
          fetch-depth: 0
      - name: Shorten known-hanging CDP screenshot probe
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/acceptance/task-center-desktop.mjs'
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/acceptance/task-center-desktop.mjs')
          text = path.read_text(encoding='utf-8')
          old = "}), 10_000, `${viewport.width}×${viewport.height} ${theme} CDP 截图`)"
          new = "}), 3_000, `${viewport.width}×${viewport.height} ${theme} CDP 截图`)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one CDP screenshot timeout contract, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'agent-lens-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add "$target"
          git commit -m 'test: 缩短桌面截图兜底探测等待'
          git push origin HEAD:feature/1.0.0-alpha.3-task-surface
