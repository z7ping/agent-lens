name: 临时 DSH M 级性能基准

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-dsh-m-benchmark.yml'

permissions:
  contents: read

jobs:
  dsh-m:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run perf:dsh-history-idle -- --files=2000 --events-per-file=20 --payload-bytes=4096 --samples=8

# trigger
