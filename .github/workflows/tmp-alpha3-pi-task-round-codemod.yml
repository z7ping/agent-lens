name: Temp Alpha3 Pi TaskRound Codemod

on:
  push:
    branches:
      - bugfix/alpha3-pi-task-round-codemod
    paths:
      - .github/workflows/tmp-alpha3-pi-task-round-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/alpha3-pi-task-round-codemod
      - name: Migrate Pi Live to shared task rounds
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replace(source, pattern, after, label) {
            if (!pattern.test(source)) throw new Error(`missing ${label}`)
            return source.replace(pattern, after)
          }

          const pagePath = 'packages/web/src/features/PiLivePage.tsx'
          let page = fs.readFileSync(pagePath, 'utf8')
          page = replace(page, /import ReactMarkdown from 'react-markdown'\n/, '', 'ReactMarkdown import')
          page = replace(page, /import \{ TaskMessage \} from '\.\/TaskMessage'\n/, '', 'TaskMessage import')
          page = replace(
            page,
            /import \{ projectPiLiveHistory, type PiLiveHistoryItem \} from '\.\/pi-live-history'\n/,
            "import { projectPiLiveHistory, type PiLiveHistoryItem } from './pi-live-history'\nimport { PiLiveHistoryTaskRound, PiLiveRunningTaskRound } from './PiLiveTaskRound'\nimport { projectPiLiveTaskRounds } from './pi-live-task-projection'\n",
            'Pi task projection imports',
          )
          page = replace(page, /const PI_LIVE_HISTORY_CHUNK_SIZE = 8\n/, '', 'old history chunk size')
          page = replace(
            page,
            /\nfunction PiLiveHistoryRow\(\{ item \}: \{ item: PiLiveHistoryItem \}\) \{[\s\S]*?\n\}\n\nfunction historyEstimate/,
            '\nfunction historyEstimate',
            'old PiLiveHistoryRow',
          )
          page = replace(
            page,
            /  const history = useMemo\(\(\) => projectPiLiveHistory\(snapshot\), \[snapshot\]\)\n  const historyChunks = useMemo\(\(\) => \{[\s\S]*?\n  \}, \[history\]\)\n/,
            "  const history = useMemo(() => projectPiLiveHistory(snapshot), [snapshot])\n  const historyRounds = useMemo(() => projectPiLiveTaskRounds(history), [history])\n",
            'history chunk projection',
          )
          page = replace(
            page,
            /          \{historyChunks\.map\(\(chunk, index\) => <VirtualRoundMount[\s\S]*?<\/VirtualRoundMount>\)\}\n/,
            `          {historyRounds.map((projection, index) => <VirtualRoundMount
              key={projection.model.id}
              rootSelector=".pi-live-reader"
              flowRoot
              eager={index >= historyRounds.length - PI_LIVE_EAGER_CHUNKS}
              estimate={projection.items.reduce((total, item) => total + historyEstimate(item), 0) + 46}
            >
              <PiLiveHistoryTaskRound projection={projection}/>
            </VirtualRoundMount>)}
`,
            'history chunk render',
          )
          page = replace(
            page,
            /          \{\(thinkingText \|\| tools\.length > 0 \|\| streamText\) && <section className="pi-live-current-round">[\s\S]*?<\/section>\}\n/,
            `          {(thinkingText || tools.length > 0 || streamText) && <PiLiveRunningTaskRound
              thinkingText={thinkingText}
              tools={tools}
              streamText={streamText}
              isStreaming={state?.isStreaming ?? false}
              pendingMessageCount={state?.pendingMessageCount ?? 0}
            />}
`,
            'old current round render',
          )
          fs.writeFileSync(pagePath, page.replace(/[ \t]+$/gm, ''))

          const perfPath = 'scripts/performance/pi-live-history-virtualization-benchmark.ts'
          let perf = fs.readFileSync(perfPath, 'utf8')
          perf = replace(
            perf,
            /const \[page, mount\] = await Promise\.all\(\[\n  readFile\(new URL\('\.\.\/\.\.\/packages\/web\/src\/features\/PiLivePage\.tsx',[^\n]*\n  readFile\(new URL\('\.\.\/\.\.\/packages\/web\/src\/components\/VirtualRoundMount\.tsx',[^\n]*\n\]\)/,
            `const [page, mount, projection] = await Promise.all([
              readFile(new URL('../../packages/web/src/features/PiLivePage.tsx', import.meta.url), 'utf8'),
              readFile(new URL('../../packages/web/src/components/VirtualRoundMount.tsx', import.meta.url), 'utf8'),
              readFile(new URL('../../packages/web/src/features/pi-live-task-projection.ts', import.meta.url), 'utf8'),
            ])`,
            'performance sources',
          )
          perf = replace(
            perf,
            /const chunkSize = Number\(page\.match\(\/PI_LIVE_HISTORY_CHUNK_SIZE\\s\*=\\s\*\(\\d\+\)\/\)\?\.\[1\]\)/,
            "const chunkSize = Number(projection.match(/PI_LIVE_HISTORY_ROUND_FACT_LIMIT\\s*=\\s*(\\d+)/)?.[1])",
            'history fact limit source',
          )
          perf = replace(
            perf,
            /if \(!\/historyChunks\\\.map\/\.test\(page\) \|\| !\/VirtualRoundMount\/\.test\(page\)\) throw new Error\('Pi Live history chunk virtualization is missing'\)/,
            "if (!/historyRounds\\.map/.test(page) || !/VirtualRoundMount/.test(page) || !/PiLiveHistoryTaskRound/.test(page)) throw new Error('Pi Live semantic round virtualization is missing')",
            'semantic round performance contract',
          )
          fs.writeFileSync(perfPath, perf.replace(/[ \t]+$/gm, ''))

          const workflowPath = '.github/workflows/pi-live-performance.yml'
          let workflow = fs.readFileSync(workflowPath, 'utf8')
          if (!workflow.includes("packages/web/src/features/PiLiveTaskRound.tsx")) {
            workflow = replace(
              workflow,
              /      - 'packages\/web\/src\/features\/PiLivePage\.tsx'\n/,
              "      - 'packages/web/src/features/PiLivePage.tsx'\n      - 'packages/web/src/features/PiLiveTaskRound.tsx'\n      - 'packages/web/src/features/pi-live-task-projection.ts'\n",
              'performance workflow paths',
            )
          }
          fs.writeFileSync(workflowPath, workflow.replace(/[ \t]+$/gm, ''))
          NODE
      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name "7ping"
          git config user.email "z7ping@outlook.com"
          git add packages/web/src/features/PiLivePage.tsx scripts/performance/pi-live-history-virtualization-benchmark.ts .github/workflows/pi-live-performance.yml
          git diff --cached --check
          git commit -m "refactor: Pi Live 接入共享 TaskRound"
          git push origin HEAD:bugfix/alpha3-pi-task-round-codemod
