name: One-off desktop startup patch

on:
  push:
    paths:
      - '.github/workflows/oneoff-desktop-startup-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
      - name: Apply startup patch
        run: node scripts/apply-desktop-pre-ready-runtime-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/main.mjs
          git diff --cached --check
          git commit -m "解耦桌面运行时与界面就绪"
          git push origin HEAD:main
