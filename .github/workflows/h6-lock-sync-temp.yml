name: H6 Lock Sync Temp

on:
  push:
    branches:
      - chore/h6-lock-sync-temp

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.event.head_commit.message != 'chore: sync h6 package lock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/h6-lock-sync-temp
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync h6 package lock"
          git push origin HEAD:chore/h6-lock-sync-temp
