name: Hub Status Sync Temp

on:
  push:
    branches:
      - chore/hub-status-sync-temp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/hub-status-sync-temp
      - run: python3 .github/hub-status-sync-temp.py
      - run: git diff --check
      - run: |
          git config user.name 7ping
          git config user.email ne_lucifer@163.com
          git add docs/1.0/IMPLEMENTATION-STATUS.md
          git commit -m "docs: 同步 Hub H6-H11 实现状态"
          git push origin HEAD:chore/hub-status-sync-temp
