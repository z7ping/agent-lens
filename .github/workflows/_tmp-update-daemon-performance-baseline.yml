name: 临时同步 Daemon 启动性能基线

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-update-daemon-performance-baseline.yml'
      - '.github/_tmp_update_daemon_performance_baseline.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 更新性能基线
        run: python .github/_tmp_update_daemon_performance_baseline.py
      - name: 检查并提交
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/_tmp_update_daemon_performance_baseline.py .github/workflows/_tmp-update-daemon-performance-baseline.yml
          git add docs/1.0/PERFORMANCE-BASELINE.md
          git diff --cached --check
          git commit -m 'docs: 记录 Daemon 启动期性能治理结果'
          git push origin HEAD:main
