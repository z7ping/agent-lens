name: AgentLens review unknown check

on:
  push:
    branches:
      - fix/alpha3-codex-provenance-activity
    paths:
      - .github/workflows/_agentlens_review_unknown_check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck affected packages
        run: |
          npm run typecheck --workspace @agent-lens/core
          npm run typecheck --workspace @agent-lens/protocol
          npm run typecheck --workspace @agent-lens/projection-review
          npm run typecheck --workspace @agent-lens/source-codex
      - name: Focused tests
        run: |
          npm test --workspace @agent-lens/projection-review
          npm test --workspace @agent-lens/source-codex
