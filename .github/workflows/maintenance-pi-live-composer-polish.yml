name: One-off Pi Live Composer Polish

on:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - .github/workflows/maintenance-pi-live-composer-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Polish Pi Live composer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function patch(path, replacements) {
            let source = fs.readFileSync(path, 'utf8')
            for (const [from, to, expected = 1] of replacements) {
              const count = source.split(from).length - 1
              if (count !== expected) throw new Error(`${path}: expected ${expected}, found ${count}: ${from.slice(0, 100)}`)
              source = source.replaceAll(from, to)
            }
            fs.writeFileSync(path, source)
          }

          patch('packages/web/src/features/PiLivePage.tsx', [
            [
              'title="Pi 模型"',
              "title={state?.model ? `Pi 模型 · ${modelLabel(state)}` : 'Pi 模型'}",
            ],
            [
              'title="Pi Thinking Level"',
              "title={`Pi Thinking Level · ${state?.thinkingLevel || '未设置'}`}",
            ],
            [
              '<div className="pi-live-compose-hint">Enter {state?.isStreaming ? (mode === \'steer\' ? \'立即介入\' : \'按当前模式发送\') : \'开始新一轮\'} · Alt+Enter 完成后继续 · Shift+Enter 换行</div>',
              '<div className="pi-live-compose-hint">Enter {state?.isStreaming ? (mode === \'steer\' ? \'立即介入\' : \'按当前模式发送\') : \'开始新一轮\'} · Alt+Enter 完成后继续 · Shift+Enter 换行{state?.isStreaming ? \' · Esc 中断并恢复排队\' : \'\'}</div>',
            ],
          ])

          patch('packages/web/src/pi-live.css', [
            [
              '.pi-live-compose-settings select:first-child { width: clamp(210px, 22vw, 270px); max-width: 270px; }',
              '.pi-live-compose-settings select:first-child { width: clamp(240px, 25vw, 320px); max-width: 320px; }',
            ],
            [
              '.pi-live-compose-settings select:last-child { width: clamp(145px, 14vw, 180px); max-width: 180px; }',
              '.pi-live-compose-settings select:last-child { width: clamp(155px, 16vw, 200px); max-width: 200px; }',
            ],
            [
              '  font-size: 11px;\n  line-height: 1.35;',
              '  font-size: 12px;\n  line-height: 1.35;',
            ],
            [
              '@media (max-width: 1199.98px) {\n  .pi-live-page { --pi-live-side: 260px; }',
              '@media (max-width: 1199.98px) {\n  .pi-live-page { --pi-live-side: 260px; }\n  .pi-live-compose-runtime { display: none; }',
            ],
          ])
          NODE
          git diff --check
      - name: Commit Pi Live composer polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/web/src/features/PiLivePage.tsx packages/web/src/pi-live.css
          git commit -m 'fix(web): 完整展示 Pi 模型与输入快捷提示'
          git push origin HEAD:${GITHUB_REF_NAME}
