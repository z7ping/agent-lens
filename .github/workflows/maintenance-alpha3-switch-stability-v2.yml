name: One-off Alpha3 Switch Stability V2

on:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - .github/workflows/maintenance-alpha3-switch-stability-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for task list before switch soak
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/acceptance/task-center-desktop.mjs'
          let source = fs.readFileSync(path, 'utf8')
          const from = "  const initialCount = await withTimeout(win.webContents.executeJavaScript(`document.querySelectorAll('.task-center-rail button.session-item').length`), 3_000, '读取任务数量')\n  if (initialCount < 2) return { skipped: true, reason: `真实任务不足 2 条（当前 ${initialCount} 条）`, requiredSwitches: 100, ok: true }"
          const to = "  let initialCount = 0\n  for (let attempt = 0; attempt < 80; attempt += 1) {\n    initialCount = await withTimeout(win.webContents.executeJavaScript(`document.querySelectorAll('.task-center-rail button.session-item').length`), 2_000, '读取任务数量')\n    if (initialCount >= 2) break\n    await delay(50)\n  }\n  if (initialCount < 2) return { skipped: false, requiredSwitches: 100, completedSwitches: 0, errors: [`任务列表在 4 秒内未就绪：需要至少 2 条，实际 ${initialCount} 条`], ok: false }"
          const count = source.split(from).length - 1
          if (count !== 1) throw new Error(`expected one switch readiness block, found ${count}`)
          source = source.replace(from, to)
          fs.writeFileSync(path, source)
          NODE
          git diff --check
          node --check scripts/acceptance/task-center-desktop.mjs
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/acceptance/task-center-desktop.mjs
          git commit -m 'fix(alpha3): 等待任务列表就绪后执行百次切换'
          git push origin HEAD:${GITHUB_REF_NAME}
