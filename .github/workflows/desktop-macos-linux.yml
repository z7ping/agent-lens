name: macOS and Linux Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/src/hook-execution*'
      - 'scripts/prepare-desktop.mjs'
      - 'scripts/prepare-macos-icon.sh'
      - 'scripts/check-brand-assets.mjs'
      - 'scripts/check-release-signing.mjs'
      - 'scripts/smoke-desktop-runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/design/brand/agentlens-icon-master.svg'
      - '.github/workflows/desktop-macos-linux.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
      release_tag:
        description: '可选：补发到已有 Release，例如 v1.0.0-alpha.5'
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'macos' || inputs.target == 'all' }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve manual release metadata
        id: manual_release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs

      - name: Note unsigned prerelease
        if: (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.manual_release.outputs.prerelease == 'true')
        shell: bash
        run: |
          echo 'AgentLens prerelease: macOS DMG/ZIP may be published unsigned and without notarization for alpha/beta/rc dogfood.'

      - name: Materialize App Store Connect API key
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.manual_release.outputs.prerelease == 'false')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            KEY_PATH="$RUNNER_TEMP/agentlens-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Require macOS release signing and notarization credentials
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.manual_release.outputs.prerelease == 'false')
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/check-release-signing.mjs macos

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build unsigned macOS desktop
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.release_tag == '' || steps.manual_release.outputs.prerelease == 'true')) || (github.event_name == 'release' && github.event.release.prerelease == true)
        run: npm run desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS desktop
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.manual_release.outputs.prerelease == 'false')
        run: npm run desktop:mac:release
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && steps.manual_release.outputs.prerelease == 'false')
        shell: bash
        run: |
          APP="$(find release/macos -type d -path '*/AgentLens.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo '没有找到 macOS AgentLens.app' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/macos -type f -path '*/AgentLens.app/Contents/MacOS/AgentLens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 macOS AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/macos
          shopt -s nullglob
          files=(AgentLens-*-macOS-x64.dmg AgentLens-*-macOS-x64.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 macOS x64 发布产物" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > SHA256SUMS-macos-x64.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-macos-x64-${{ github.run_id }}
          path: |
            release/macos/AgentLens-*-macOS-x64.dmg
            release/macos/AgentLens-*-macOS-x64.zip
            release/macos/SHA256SUMS-macos-x64.txt
          if-no-files-found: error

      - name: Attach macOS artifacts to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/macos/AgentLens-*-macOS-x64.dmg release/macos/AgentLens-*-macOS-x64.zip release/macos/SHA256SUMS-macos-x64.txt --clobber

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify manual release exists
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build Linux desktop
        run: npm run desktop:linux

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/linux -type f -path '*/linux*-unpacked/agentlens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 Linux AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/linux
          shopt -s nullglob
          files=(AgentLens-*-Linux-x86_64.AppImage AgentLens-*-Linux-amd64.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 Linux x64 发布产物" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-linux-x64.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-linux-x64-${{ github.run_id }}
          path: |
            release/linux/AgentLens-*-Linux-x86_64.AppImage
            release/linux/AgentLens-*-Linux-amd64.deb
            release/linux/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

      - name: Attach Linux artifacts to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/linux/AgentLens-*-Linux-x86_64.AppImage release/linux/AgentLens-*-Linux-amd64.deb release/linux/SHA256SUMS-linux-x64.txt --clobber
