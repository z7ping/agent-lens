name: macOS and Linux Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/src/hook-execution*'
      - 'scripts/prepare-desktop.mjs'
      - 'scripts/prepare-macos-icon.sh'
      - 'scripts/check-brand-assets.mjs'
      - 'scripts/check-release-signing.mjs'
      - 'scripts/smoke-desktop-runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/design/brand/agentlens-icon-master.svg'
      - '.github/workflows/desktop-macos-linux.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: node scripts/check-release-version.mjs

      - name: Note unsigned prerelease
        if: github.event_name == 'release' && github.event.release.prerelease == true
        shell: bash
        run: |
          echo 'AgentLens prerelease: macOS DMG/ZIP may be published unsigned and without notarization for alpha/beta/rc dogfood.'

      - name: Materialize App Store Connect API key
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            KEY_PATH="$RUNNER_TEMP/agentlens-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Require macOS release signing and notarization credentials
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/check-release-signing.mjs macos

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build unsigned macOS desktop
        if: github.event_name != 'release' || github.event.release.prerelease == true
        run: npm run desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS desktop
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: npm run desktop:mac:release
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: bash
        run: |
          APP="$(find release/macos -type d -path '*/AgentLens.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo '没有找到 macOS AgentLens.app' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/macos -type f -path '*/AgentLens.app/Contents/MacOS/AgentLens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 macOS AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/macos
          shopt -s nullglob
          files=(AgentLens-*-macOS-x64.dmg AgentLens-*-macOS-x64.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 macOS x64 发布产物" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > SHA256SUMS-macos-x64.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-macos-x64-${{ github.run_id }}
          path: |
            release/macos/AgentLens-*-macOS-x64.dmg
            release/macos/AgentLens-*-macOS-x64.zip
            release/macos/SHA256SUMS-macos-x64.txt
          if-no-files-found: error

      - name: Attach macOS artifacts to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/macos/AgentLens-*-macOS-x64.dmg release/macos/AgentLens-*-macOS-x64.zip release/macos/SHA256SUMS-macos-x64.txt --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: node scripts/check-release-version.mjs

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build Linux desktop
        run: npm run desktop:linux

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/linux -type f -path '*/linux*-unpacked/agentlens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 Linux AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/linux
          shopt -s nullglob
          files=(AgentLens-*-Linux-x64.AppImage AgentLens-*-Linux-x64.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 Linux x64 发布产物" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-linux-x64.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-linux-x64-${{ github.run_id }}
          path: |
            release/linux/AgentLens-*-Linux-x64.AppImage
            release/linux/AgentLens-*-Linux-x64.deb
            release/linux/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

      - name: Attach Linux artifacts to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/linux/AgentLens-*-Linux-x64.AppImage release/linux/AgentLens-*-Linux-x64.deb release/linux/SHA256SUMS-linux-x64.txt --clobber
