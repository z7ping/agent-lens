name: macOS and Linux Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/cli/src/hook-execution*'
      - 'scripts/prepare-desktop.mjs'
      - 'scripts/prepare-macos-icon.sh'
      - 'scripts/check-brand-assets.mjs'
      - 'scripts/check-release-signing.mjs'
      - 'scripts/check-release-candidate.mjs'
      - 'scripts/smoke-desktop-runtime.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/design/brand/agentlens-icon-master.svg'
      - '.github/workflows/desktop-macos-linux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

      - name: Wait for Draft Release candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs --wait-seconds 120

      - name: Note unsigned prerelease
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        shell: bash
        run: echo 'AgentLens prerelease candidate: macOS DMG/ZIP may remain unsigned and without notarization for alpha/beta/rc dogfood.'

      - name: Materialize App Store Connect API key
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            KEY_PATH="$RUNNER_TEMP/agentlens-notarization-key.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi

      - name: Require macOS release signing and notarization credentials
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/check-release-signing.mjs macos

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build unsigned macOS desktop
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
        run: npm run desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS desktop
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: npm run desktop:mac:release
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: bash
        run: |
          APP="$(find release/macos -type d -path '*/AgentLens.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo '没有找到 macOS AgentLens.app' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/macos -type f -path '*/AgentLens.app/Contents/MacOS/AgentLens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 macOS AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/macos
          shopt -s nullglob
          files=(AgentLens-*.dmg AgentLens-*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 macOS 发布产物" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > "SHA256SUMS-macos-${{ matrix.arch }}.txt"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-macos-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            release/macos/AgentLens-*.dmg
            release/macos/AgentLens-*.zip
            release/macos/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Attach macOS artifacts to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/macos/AgentLens-*.dmg release/macos/AgentLens-*.zip "release/macos/SHA256SUMS-macos-${{ matrix.arch }}.txt" --clobber

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

      - name: Wait for Draft Release candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs --wait-seconds 120

      - name: Verify source
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test

      - name: Build Linux desktop
        run: npm run desktop:linux

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/linux -type f -path '*/linux*-unpacked/agentlens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 Linux AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/linux
          shopt -s nullglob
          files=(AgentLens-*.AppImage AgentLens-*.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 Linux 发布产物" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > "SHA256SUMS-linux-${{ matrix.arch }}.txt"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-linux-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            release/linux/AgentLens-*.AppImage
            release/linux/AgentLens-*.deb
            release/linux/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Attach Linux artifacts to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/linux/AgentLens-*.AppImage release/linux/AgentLens-*.deb "release/linux/SHA256SUMS-linux-${{ matrix.arch }}.txt" --clobber
