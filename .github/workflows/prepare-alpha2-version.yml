name: Prepare Alpha2 Version

on:
  push:
    branches:
      - bugfix/1.0.0-alpha.2
    paths:
      - .github/workflows/prepare-alpha2-version.yml

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Bump repository version
        run: node scripts/bump-version.mjs 1.0.0-alpha.2

      - name: Verify version consistency
        run: node scripts/check-version-consistency.mjs

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Version already prepared"
            exit 0
          fi
          git commit -m "chore: 升级版本至 1.0.0-alpha.2"
          git push origin HEAD:bugfix/1.0.0-alpha.2
