name: Alpha.3 Pi SDK Type Baseline

on:
  push:
    branches:
      - bugfix/alpha3-pi-sdk-types

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Resolve official Pi SDK baseline
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck Pi runtime
        run: npm run typecheck --workspace @agent-lens/runtime-cordis
      - name: Test Pi runtime
        run: npm run test --workspace @agent-lens/runtime-cordis
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha3-pi-sdk-package-lock
          path: package-lock.json
          if-no-files-found: error
