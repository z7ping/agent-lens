name: Alpha.3 Pi SDK Type Baseline

on:
  push:
    branches:
      - bugfix/alpha3-pi-sdk-types-2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Resolve official Pi SDK baseline
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Persist generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock Pi SDK type baseline"
            git push origin HEAD:bugfix/alpha3-pi-sdk-types-2
          fi
      - name: Typecheck Pi runtime
        run: npm run typecheck --workspace @agent-lens/runtime-cordis
      - name: Test Pi runtime
        run: npm run test --workspace @agent-lens/runtime-cordis
