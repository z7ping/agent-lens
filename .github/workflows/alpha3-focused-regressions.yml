name: Alpha.3 Focused Regressions

on:
  workflow_dispatch:
  push:
    branches:
      - feature/1.0.0-alpha.3-task-surface
    paths:
      - packages/core/src/**
      - packages/runtime-cordis/src/**
      - packages/storage-sqlite/src/**
      - packages/projection-session/src/**
      - packages/projection-review/src/**
      - packages/source-pi/src/**
      - packages/source-codex/src/**
      - packages/web/src/**
      - .github/workflows/alpha3-focused-regressions.yml

permissions:
  contents: write

jobs:
  focused-regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Repair ReviewPage conditional JSX
        shell: pwsh
        run: |
          $path = 'packages/web/src/features/ReviewPage.tsx'
          $text = Get-Content -Raw -Path $path
          $from = '{inspect && <Inspector node={inspect} loadSourceRecord={model.sourceRecord} onClose={() => setInspect(null)}/> '
          $to = '{inspect && <Inspector node={inspect} loadSourceRecord={model.sourceRecord} onClose={() => setInspect(null)}/>} '
          if (-not $text.Contains($from)) { throw 'ReviewPage target JSX not found' }
          $text = $text.Replace($from, $to)
          Set-Content -NoNewline -Encoding UTF8 -Path $path -Value $text
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m 'fix: 闭合 ReviewPage Inspector 条件 JSX'
          git push origin HEAD:feature/1.0.0-alpha.3-task-surface
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Core typecheck
        run: npm run typecheck --workspace @agent-lens/core
      - name: Storage typecheck
        run: npm run typecheck --workspace @agent-lens/storage-sqlite
      - name: Storage tests
        run: npm run test --workspace @agent-lens/storage-sqlite
      - name: Review typecheck
        run: npm run typecheck --workspace @agent-lens/projection-review
      - name: Review tests
        run: npm run test --workspace @agent-lens/projection-review
      - name: Pi typecheck
        run: npm run typecheck --workspace @agent-lens/source-pi
      - name: Pi tests
        run: npm run test --workspace @agent-lens/source-pi
      - name: Codex typecheck
        run: npm run typecheck --workspace @agent-lens/source-codex
      - name: Codex tests
        run: npm run test --workspace @agent-lens/source-codex
      - name: Web typecheck
        run: npm run typecheck --workspace @agent-lens/web
      - name: Web tests
        run: npm run test --workspace @agent-lens/web
