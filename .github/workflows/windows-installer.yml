name: Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: node scripts/check-release-version.mjs

      - name: Note unsigned prerelease
        if: github.event_name == 'release' && github.event.release.prerelease == true
        shell: pwsh
        run: |
          Write-Host 'AgentLens prerelease: Windows installer may be published unsigned for alpha/beta/rc dogfood.'

      - name: Require Windows release signing credentials
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: node scripts/check-release-signing.mjs windows

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer
        run: npm run desktop:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify Windows installer signature
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows 安装器签名无效：$($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Signed installer: $($installer.Name)"
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Smoke packaged Windows desktop
        shell: pwsh
        run: ./scripts/smoke-windows-desktop.ps1

      - name: Install, upgrade and verify Desktop/npm CLI coexistence
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }
          $requireSignature = '${{ github.event_name == 'release' && github.event.release.prerelease == false }}' -eq 'true'
          ./scripts/smoke-windows-installer-cli.ps1 -InstallerPath $installer.FullName -RequireSignature $requireSignature

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/windows/*.exe
          if (-not $files) { throw 'No Windows installer was produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/windows/SHA256SUMS-windows.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-windows-${{ github.run_id }}
          path: |
            release/windows/*.exe
            release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/windows/*.exe release/windows/SHA256SUMS-windows.txt --clobber
