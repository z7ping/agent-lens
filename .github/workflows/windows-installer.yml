name: Windows Installer Candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

      - name: Wait for Draft Release candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs --wait-seconds 120

      - name: Note unsigned prerelease
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
        shell: pwsh
        run: |
          Write-Host 'AgentLens prerelease candidate: Windows installer may remain unsigned for alpha/beta/rc dogfood.'

      - name: Require Windows release signing credentials
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: node scripts/check-release-signing.mjs windows

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer candidate
        run: npm run desktop:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify Windows installer signature
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows 安装器签名无效：$($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Signed installer: $($installer.Name)"
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Smoke packaged Windows desktop
        shell: pwsh
        run: ./scripts/smoke-windows-desktop.ps1

      - name: Install, upgrade and smoke Windows desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }

          $installDir = Join-Path $env:RUNNER_TEMP 'agent-lens-installed-smoke'
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows 安装器静默安装失败：$($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'AgentLens.exe'
          if (-not (Test-Path $installedExe)) { throw "安装完成后没有找到 AgentLens.exe：$installedExe" }
          $requireSignature = '${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}' -eq 'true'
          if ($requireSignature) {
            $installedSignature = Get-AuthenticodeSignature $installedExe
            if ($installedSignature.Status -ne 'Valid') { throw "安装后的 AgentLens.exe 签名无效：$($installedSignature.Status)" }
          }
          ./scripts/smoke-windows-desktop.ps1 -ExecutablePath $installedExe

          $dataDir = Join-Path $HOME '.agent-lens/1.0'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $preserveMarker = Join-Path $dataDir 'windows-installer-preserve-ci.txt'
          'preserve-me' | Set-Content -Encoding UTF8 $preserveMarker

          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Windows 安装器不能直接覆盖已有安装：$($upgrade.ExitCode)" }
          if (-not (Test-Path $installedExe)) { throw '覆盖升级后 AgentLens.exe 丢失' }
          if (-not (Test-Path $preserveMarker)) { throw '覆盖升级错误删除了 ~/.agent-lens/1.0 数据' }
          ./scripts/smoke-windows-desktop.ps1 -ExecutablePath $installedExe

          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if ($null -eq $uninstaller) { throw '覆盖升级后没有找到卸载器' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Windows 静默卸载失败：$($uninstall.ExitCode)" }
          if (-not (Test-Path $preserveMarker)) { throw '普通卸载错误删除了 ~/.agent-lens/1.0 数据' }

          Remove-Item -Force $preserveMarker -ErrorAction SilentlyContinue

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/windows/*.exe
          if (-not $files) { throw 'No Windows installer was produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/windows/SHA256SUMS-windows.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-windows-${{ github.run_id }}
          path: |
            release/windows/*.exe
            release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach installer to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/windows/*.exe release/windows/SHA256SUMS-windows.txt --clobber
