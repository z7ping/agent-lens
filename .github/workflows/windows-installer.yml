name: Windows Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-watch:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: 重复监听回归
        shell: pwsh
        run: |
          for ($i = 1; $i -le 12; $i++) {
            Write-Host "监听检查 $i"
            npx tsx --test packages/source-support/src/watch-source-files.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
