name: Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/windows-installer.yml

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: node scripts/check-release-version.mjs

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer
        run: npm run desktop:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/windows/*.exe
          if (-not $files) { throw 'No Windows installer was produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/windows/SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-windows-${{ github.ref_name || github.sha }}
          path: |
            release/windows/*.exe
            release/windows/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/windows/*.exe release/windows/SHA256SUMS.txt --clobber
