name: Publish AgentLens 1.0

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Verify npm package contents
        run: npm pack --dry-run

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Pack exact npm artifact
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
          cp package-lock.json release/package-lock.json
          sha256sum release/*.tgz release/package-lock.json release/sbom.cdx.json > release/SHA256SUMS.txt

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS.txt release/sbom.cdx.json --clobber

      - name: Publish exact tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: npm publish "$(ls release/*.tgz)" --access public --provenance
