name: Publish AgentLens 1.0

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-publish.yml

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify brand assets
        run: npm run check:brand-assets

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Pack, install and run npm artifact
        run: npm run smoke:npm-package

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Resolve npm dist-tag
        shell: bash
        run: |
          NPM_TAG="$(node scripts/resolve-npm-dist-tag.mjs)"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "npm dist-tag: $NPM_TAG"

      - name: Verify Web presentation convergence
        run: npm run check:web-presentation

      - name: Verify brand assets
        run: npm run check:brand-assets

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build distributable
        run: npm run build:dist

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Pack exact npm artifact
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
          cp package-lock.json release/package-lock.json
          sha256sum release/*.tgz release/package-lock.json release/sbom.cdx.json > release/SHA256SUMS-npm.txt

      - name: Smoke exact npm artifact
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/smoke-npm-package.mjs "./${tarballs[0]}"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS-npm.txt release/sbom.cdx.json --clobber

      - name: Publish exact tarball to npm
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm publish "./${tarballs[0]}" --tag "$NPM_TAG" --access public

  recover-alpha1:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.15.0

      - name: Check whether alpha.1 is already published
        id: published
        shell: bash
        run: |
          if npm view "@z7ping/agent-lens@1.0.0-alpha.1" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@z7ping/agent-lens@1.0.0-alpha.1 is already published; recovery is a no-op."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact alpha.1 release artifact
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release
          gh release download v1.0.0-alpha.1 \
            --pattern 'z7ping-agent-lens-1.0.0-alpha.1.tgz' \
            --pattern 'SHA256SUMS-npm.txt' \
            --dir release

      - name: Verify alpha.1 release artifact
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: grep 'z7ping-agent-lens-1.0.0-alpha.1.tgz' release/SHA256SUMS-npm.txt | sha256sum -c -

      - name: Publish alpha.1 with Trusted Publishing
        if: steps.published.outputs.exists != 'true'
        run: npm publish ./release/z7ping-agent-lens-1.0.0-alpha.1.tgz --tag alpha --access public
