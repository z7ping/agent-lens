name: Publish AgentLens 1.0

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Resolve npm dist-tag
        shell: bash
        run: |
          NPM_TAG="$(node scripts/resolve-npm-dist-tag.mjs)"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "npm dist-tag: $NPM_TAG"

      - name: Download verified npm candidate from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" \
            --pattern '*.tgz' \
            --pattern 'SHA256SUMS-npm.txt' \
            --pattern 'sbom.cdx.json' \
            --pattern 'package-lock.json' \
            --dir release \
            --clobber

      - name: Verify candidate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS-npm.txt
          shopt -s nullglob
          tarballs=(*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi

      - name: Smoke exact published candidate once more
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/smoke-npm-package.mjs "./${tarballs[0]}"

      - name: Verify npm publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Publish exact verified tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm publish "./${tarballs[0]}" --tag "$NPM_TAG" --access public --provenance
