name: Publish AgentLens 1.0

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    uses: ./.github/workflows/desktop-windows.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/desktop-macos.yml
    secrets: inherit

  linux:
    uses: ./.github/workflows/desktop-linux.yml
    secrets: inherit

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack npm artifact
        shell: pwsh
        run: |
          $packDir = Join-Path $env:RUNNER_TEMP 'agentlens-pack'
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          npm pack --pack-destination $packDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarballs = @(Get-ChildItem $packDir -Filter '*.tgz')
          if ($tarballs.Count -ne 1) { throw "预期一个 npm 包，实际找到 $($tarballs.Count) 个。" }
          "PACKED_TARBALL=$($tarballs[0].FullName)" >> $env:GITHUB_ENV

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Pack, install and run npm artifact
        shell: pwsh
        run: node scripts/smoke-npm-package.mjs $env:PACKED_TARBALL

  publish:
    runs-on: ubuntu-latest
    needs: [verify, windows, macos, linux]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        run: node scripts/check-release-version.mjs

      - name: Resolve npm dist-tag
        shell: bash
        run: |
          NPM_TAG="$(node scripts/resolve-npm-dist-tag.mjs)"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "npm dist-tag: $NPM_TAG"

      - name: Pack exact npm artifact
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
          cp package-lock.json release/package-lock.json
          sha256sum release/*.tgz release/package-lock.json release/sbom.cdx.json > release/SHA256SUMS-npm.txt

      - name: Smoke distributable
        run: npm run smoke:dist

      - name: Smoke exact npm artifact
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/smoke-npm-package.mjs "./${tarballs[0]}"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-lens-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS-npm.txt release/sbom.cdx.json --clobber

      - name: Publish exact tarball to npm
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm publish "./${tarballs[0]}" --tag "$NPM_TAG" --access public
