name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

  build-windows-runner:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows Hook runner
        shell: pwsh
        run: ./server/hooks/build-windows-hook-runner.ps1

      - name: Run Windows tests
        run: npm test

      - name: Upload Windows Hook runner
        uses: actions/upload-artifact@v4
        with:
          name: windows-hook-runner
          path: server/hooks/windows-hook-runner.exe
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - build-windows-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows Hook runner
        uses: actions/download-artifact@v4
        with:
          name: windows-hook-runner
          path: server/hooks

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      - name: Create checksums
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          sha256sum server/hooks/windows-hook-runner.exe release/*.tgz package-lock.json package.json > SHA256SUMS.txt

      - name: Upload release verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            SHA256SUMS.txt
            sbom.cdx.json
            release/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
