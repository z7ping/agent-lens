name: Quality Bootstrap

on:
  push:
    branches: [feature/1.0.0-alpha.3-task-surface]
    paths:
      - 'package.json'
      - 'apps/desktop/package.json'
      - 'packages/projection-timeline/package.json'
      - 'eslint.config.mjs'
      - '.jscpd.json'
      - '.github/workflows/quality-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify types
        continue-on-error: true
        run: npm run typecheck

      - name: Verify tests
        continue-on-error: true
        run: npm test

      - name: Audit lint
        continue-on-error: true
        run: npm run lint

      - name: Audit dead code
        continue-on-error: true
        run: npm run check:dead-code

      - name: Audit duplication
        continue-on-error: true
        run: npm run check:duplicates

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: 同步代码质量依赖锁文件'
          git push
