name: Linux Desktop

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：补发到已有 Release，例如 v1.0.0-alpha.5'
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify manual release exists
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Linux desktop
        run: npm run desktop:linux

      # AppImageHub uses AppStream for the catalog screenshot, independent of the startup snapshot.
      - name: Verify AppImage catalog metadata
        shell: bash
        run: |
          APPIMAGE="$(find release/linux -maxdepth 1 -type f -name 'AgentLens-*-x86_64.AppImage' | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "没有找到 Linux AppImage" >&2
            exit 1
          fi
          APPIMAGE="$(realpath "$APPIMAGE")"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          cd "$TEMP_DIR"
          "$APPIMAGE" --appimage-extract usr/share/metainfo/dev.z7ping.agentlens.metainfo.xml >/dev/null
          META="squashfs-root/usr/share/metainfo/dev.z7ping.agentlens.metainfo.xml"
          test -s "$META"
          grep -Fq '<launchable type="desktop-id">agentlens.desktop</launchable>' "$META"

      # Pin the build image to glibc 2.35 and inspect the actual runtime and payload.
      # The host OS alone cannot guarantee that prebuilt native libraries are compatible.
      - name: Verify AppImage glibc ABI baseline
        shell: bash
        run: |
          APPIMAGE="$(find release/linux -maxdepth 1 -type f -name 'AgentLens-*-x86_64.AppImage' | head -n 1)"
          test -f "$APPIMAGE"
          APPIMAGE="$(realpath "$APPIMAGE")"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          cd "$WORK_DIR"
          "$APPIMAGE" --appimage-extract >/dev/null
          python3 - "$APPIMAGE" squashfs-root <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          required = (0, 0)
          offender = None
          for path in [Path(sys.argv[1]), *Path(sys.argv[2]).rglob('*')]:
              if path.is_symlink() or not path.is_file():
                  continue
              with path.open('rb') as f:
                  if f.read(4) != b'\x7fELF':
                      continue
              result = subprocess.run(['objdump', '-T', str(path)], capture_output=True, text=True)
              if result.returncode != 0 and 'not a dynamic object' in result.stderr:
                  continue  # Statically linked ELF files have no undefined GLIBC symbols.
              if result.returncode != 0:
                  raise SystemExit(f'Cannot inspect ELF symbols: {path}: {result.stderr}')
              for major, minor in re.findall(r'\*UND\*[^\n]*?GLIBC_(\d+)\.(\d+)', result.stdout):
                  version = (int(major), int(minor))
                  if version > required:
                      required, offender = version, path

          print(f'Highest required glibc ABI: {required[0]}.{required[1]} (from {offender})')
          if required > (2, 35):
              raise SystemExit('AppImage requires glibc newer than Ubuntu 22.04 (2.35)')
          PY

      - name: Smoke packaged desktop runtime
        shell: bash
        run: |
          EXECUTABLE="$(find release/linux -type f -path '*/linux*-unpacked/agentlens' | head -n 1)"
          if [ -z "$EXECUTABLE" ]; then
            echo "没有找到 Linux AgentLens 可执行文件" >&2
            exit 1
          fi
          node scripts/smoke-desktop-runtime.mjs "$EXECUTABLE"

      - name: Smoke packaged AppImage window and startup themes
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          APPIMAGE="$(find release/linux -maxdepth 1 -type f -name 'AgentLens-*-x86_64.AppImage' | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "没有找到 Linux AppImage" >&2
            exit 1
          fi
          xvfb-run -a node scripts/smoke-desktop-window.mjs "$APPIMAGE"

      - name: Create checksums
        shell: bash
        run: |
          cd release/linux
          shopt -s nullglob
          files=(AgentLens-*-x86_64.AppImage AgentLens-*-Linux-amd64.deb)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有找到 Linux x64 发布产物" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-linux-x64.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-lens-linux-x64-${{ github.run_id }}
          path: |
            release/linux/AgentLens-*-x86_64.AppImage
            release/linux/AgentLens-*-Linux-amd64.deb
            release/linux/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

      - name: Attach Linux artifacts to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/linux/AgentLens-*-x86_64.AppImage release/linux/AgentLens-*-Linux-amd64.deb release/linux/SHA256SUMS-linux-x64.txt --clobber
