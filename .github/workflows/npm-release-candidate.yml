name: npm Release Candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag and package version
        run: node scripts/check-release-version.mjs

      - name: Wait for Draft Release candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs --wait-seconds 120

      - name: Verify source and distributable
        run: |
          npm run check:web-presentation
          npm run check:brand-assets
          npm run check:desktop-shell
          npm run typecheck
          npm test
          npm run build:dist
          npm run smoke:dist

  pack:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Draft Release is still eligible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs

      - name: Pack candidate exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
          cp package-lock.json release/package-lock.json
          cd release
          shopt -s nullglob
          tarballs=(*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          sha256sum "${tarballs[0]}" package-lock.json sbom.cdx.json > SHA256SUMS-npm.txt

      - name: Upload single npm candidate
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-npm-candidate-${{ github.ref_name }}
          path: release/
          if-no-files-found: error

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Download the exact npm candidate
        uses: actions/download-artifact@v4
        with:
          name: agent-lens-npm-candidate-${{ github.ref_name }}
          path: release

      - name: Verify candidate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS-npm.txt

      - name: Install and run the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          node scripts/smoke-npm-package.mjs "./${tarballs[0]}"

  registry-auth:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

  attach:
    needs: [pack, smoke, registry-auth]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate tag
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Verify Draft Release is still eligible
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-candidate.mjs

      - name: Download verified npm candidate
        uses: actions/download-artifact@v4
        with:
          name: agent-lens-npm-candidate-${{ github.ref_name }}
          path: release

      - name: Verify candidate checksum before attach
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS-npm.txt

      - name: Attach verified npm candidate to Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release/*.tgz \
            release/SHA256SUMS-npm.txt \
            release/sbom.cdx.json \
            release/package-lock.json \
            --clobber
