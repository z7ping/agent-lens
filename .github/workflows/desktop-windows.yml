name: Windows Desktop

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：补发到已有 Release，例如 v1.0.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/check-release-version.mjs

      - name: Determine Windows signing mode
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ([bool]$env:CSC_LINK -ne [bool]$env:CSC_KEY_PASSWORD) { throw 'Windows 签名证书和密码必须同时配置。' }
          $signed = [bool]$env:CSC_LINK
          "signed=$($signed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Windows 签名模式：$signed"

      - name: Typecheck
        timeout-minutes: 15
        run: npm run typecheck

      - name: Test
        timeout-minutes: 15
        run: npm test

      - name: Build Windows installer
        run: npm run desktop:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify Windows installer signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows 安装器签名无效：$($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Signed installer: $($installer.Name)"
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Smoke packaged Windows desktop
        shell: pwsh
        run: ./scripts/smoke-windows-desktop.ps1

      - name: Install, upgrade and verify Desktop/npm CLI coexistence
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有找到 Windows 安装器' }
          $requireSignature = '${{ steps.signing.outputs.signed }}' -eq 'true'
          ./scripts/smoke-windows-installer-cli.ps1 -InstallerPath $installer.FullName -RequireSignature $requireSignature

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/windows/*.exe
          if (-not $files) { throw 'No Windows installer was produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content release/windows/SHA256SUMS-windows.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-lens-windows-${{ github.run_id }}
          path: |
            release/windows/*.exe
            release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: 标注未签名安装包
        if: steps.signing.outputs.signed != 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $body = gh release view $env:RELEASE_TAG --json body --jq .body
          if ($LASTEXITCODE -ne 0) { throw '读取 Release 说明失败。' }
          $marker = '<!-- windows-unsigned-notice -->'
          $existing = $body -join "`n"
          $updated = $existing.Replace('本版本的 Windows 安装包尚待补发；计划提供的安装包未经代码签名。', '本版本的 Windows 安装包未经代码签名。')
          if (-not $updated.Contains($marker)) {
            $notice = "$marker`n> Windows 安装包未经代码签名。下载或运行时，浏览器或 Windows SmartScreen 可能显示未知发布者或安全提示。请从本项目的 GitHub Release 下载，并使用 SHA256SUMS-windows.txt 核对文件。`n"
            $updated = $notice + "`n" + $updated
          }
          if ($updated -ne $existing) {
            $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            [IO.File]::WriteAllText($file, $updated, [Text.UTF8Encoding]::new($false))
            gh release edit $env:RELEASE_TAG --notes-file $file
            if ($LASTEXITCODE -ne 0) { throw '更新 Release 说明失败。' }
          }

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release/windows/*.exe release/windows/SHA256SUMS-windows.txt --clobber
