name: Temp Alpha3 Pi TaskDetail Contract

on:
  push:
    branches:
      - bugfix/alpha3-pi-task-detail-contract
    paths:
      - .github/workflows/tmp-alpha3-pi-task-detail-contract.yml
      - .github/tmp-alpha3-pi-task-detail-contract.cjs

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/alpha3-pi-task-detail-contract
      - name: Update contract
        run: |
          node .github/tmp-alpha3-pi-task-detail-contract.cjs
          node --check scripts/check-pi-live-contract.mjs
      - name: Commit contract
        shell: bash
        run: |
          git config user.name "7ping"
          git config user.email "z7ping@outlook.com"
          git add scripts/check-pi-live-contract.mjs
          git diff --cached --check
          git commit -m "fix: 修正 Pi Live TaskDetailModel 契约"
          git push origin HEAD:bugfix/alpha3-pi-task-detail-contract
