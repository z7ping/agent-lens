name: Temporary Lexical Composer Migration

on:
  push:
    branches: [feature/1.0.0-alpha.3-task-surface]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/1.0.0-alpha.3-task-surface
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install Lexical
        run: npm install --workspace @agent-lens/web --save-exact --no-audit --no-fund lexical@0.49.0 @lexical/react@0.49.0 @lexical/markdown@0.49.0 @lexical/rich-text@0.49.0 @lexical/list@0.49.0 @lexical/code@0.49.0 @lexical/link@0.49.0
      - name: Apply migration
        run: |
          python .github/scripts/migrate_lexical_composer.py
          python .github/scripts/migrate_lexical_contract.py
      - name: Verify presentation
        run: npm run check:web-presentation
      - name: Typecheck Web
        run: npm run typecheck --workspace @agent-lens/web
      - name: Test Web
        run: npm test --workspace @agent-lens/web
      - name: Build Web
        run: npm run build:web
      - name: Commit verified migration
        run: |
          git rm .github/workflows/temp-lexical-composer.yml .github/scripts/migrate_lexical_composer.py .github/scripts/migrate_lexical_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/web/package.json package-lock.json packages/web/src/features/PiLivePage.tsx packages/web/src/features/pi-live-composer-contract.test.ts packages/web/src/components/markdown-content.css packages/web/src/components/PiMarkdownComposer.tsx packages/web/src/components/pi-markdown-composer.css scripts/check-pi-live-contract.mjs
          git commit -m "feat(web): Pi 输入区支持 Markdown 即时渲染"
          git push origin HEAD:feature/1.0.0-alpha.3-task-surface
