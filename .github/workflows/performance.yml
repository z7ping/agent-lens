name: AgentLens Performance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 性能基准规模
        required: true
        default: m
        type: choice
        options:
          - smoke
          - s
          - m
  push:
    branches: [main]
    paths:
      - 'scripts/performance/**'
      - 'packages/storage-sqlite/src/session-summaries.ts'
      - '.github/workflows/performance.yml'
      - 'docs/1.0/PERFORMANCE-BASELINE.md'
      - 'docs/adr/0006-performance-governance-and-architecture-guardrails.md'

permissions:
  contents: read

jobs:
  session-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke)
              echo 'args=--sessions=100 --observations-per-session=20 --evidence-per-observation=1 --samples=3' >> "$GITHUB_OUTPUT"
              ;;
            s)
              echo 'args=--sessions=1000 --observations-per-session=100 --evidence-per-observation=2 --samples=10' >> "$GITHUB_OUTPUT"
              ;;
            m)
              echo 'args=--sessions=10000 --observations-per-session=100 --evidence-per-observation=2 --samples=20' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown profile: $PROFILE" >&2
              exit 1
              ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Run session summary benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:session-summary -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/session-summary-${{ steps.profile.outputs.profile }}.txt

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error
