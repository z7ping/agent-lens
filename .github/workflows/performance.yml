name: AgentLens Performance

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 性能基准规模
        required: true
        default: m
        type: choice
        options:
          - smoke
          - s
          - m
  push:
    branches: [main]
    paths:
      - 'scripts/performance/**'
      - 'packages/source-pi/src/**'
      - 'apps/daemon/src/main.ts'
      - 'apps/daemon/src/projection-readiness.ts'
      - 'apps/daemon/src/sources/dsh.ts'
      - 'packages/storage-sqlite/src/session-summaries.ts'
      - 'packages/storage-sqlite/src/observation-pagination.ts'
      - 'packages/storage-sqlite/src/repositories.ts'
      - 'packages/storage-sqlite/src/migrations.ts'
      - 'packages/storage-sqlite/migrations/**'
      - 'packages/projection-review/src/**'
      - 'packages/projection-session/src/**'
      - 'packages/projection-usage/src/**'
      - 'packages/projection-overview/src/**'
      - '.github/workflows/performance.yml'
      - 'docs/1.0/PERFORMANCE-BASELINE.md'
      - 'docs/adr/0006-performance-governance-and-architecture-guardrails.md'

permissions:
  contents: read

jobs:
  session-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--sessions=100 --observations-per-session=20 --evidence-per-observation=1 --samples=3' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--sessions=1000 --observations-per-session=100 --evidence-per-observation=2 --samples=10' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--sessions=10000 --observations-per-session=100 --evidence-per-observation=2 --samples=20' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run session summary benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:session-summary -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/session-summary-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-session-summary-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error

  review-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--interactions=50 --observations-per-interaction=10 --evidence-per-observation=1 --samples=3 --limit=20' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--interactions=500 --observations-per-interaction=10 --evidence-per-observation=1 --samples=10 --limit=20' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--interactions=2000 --observations-per-interaction=10 --evidence-per-observation=1 --samples=10 --limit=20' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run long session review benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:review-detail -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/review-detail-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-review-detail-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error

  tool-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--installations=2 --sessions-per-installation=10 --calls-per-session=10 --evidence-per-observation=1 --samples=3 --limit=100 --global-p95-budget-ms=500 --overview-p95-budget-ms=1000' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--installations=4 --sessions-per-installation=50 --calls-per-session=50 --evidence-per-observation=1 --samples=8 --limit=100 --global-p95-budget-ms=3000 --overview-p95-budget-ms=5000' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--installations=6 --sessions-per-installation=100 --calls-per-session=100 --evidence-per-observation=1 --samples=10 --limit=100 --global-p95-budget-ms=15000 --overview-p95-budget-ms=20000' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run tool analysis and agent overview benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          node --import tsx scripts/performance/tool-overview-benchmark.ts ${{ steps.profile.outputs.args }} | tee performance-artifacts/tool-overview-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-tool-overview-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error

  pi-history-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--files=50 --records-per-file=10 --payload-bytes=1024 --samples=3' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--files=500 --records-per-file=20 --payload-bytes=2048 --samples=5' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--files=2000 --records-per-file=20 --payload-bytes=4096 --samples=8' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run Pi idle history benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:pi-history-idle -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/pi-history-idle-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-pi-history-idle-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error

  dsh-history-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--files=50 --events-per-file=10 --payload-bytes=1024 --samples=3' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--files=500 --events-per-file=20 --payload-bytes=2048 --samples=5' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--files=2000 --events-per-file=20 --payload-bytes=4096 --samples=8' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run DSH idle history benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:dsh-history-idle -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/dsh-history-idle-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-dsh-history-idle-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error

  daemon-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve benchmark profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.profile || 'smoke' }}"
          case "$PROFILE" in
            smoke) echo 'args=--sessions=100 --observations-per-session=20 --startup-mode=cycle --timeout-ms=30000' >> "$GITHUB_OUTPUT" ;;
            s) echo 'args=--sessions=1000 --observations-per-session=100 --startup-mode=cycle --timeout-ms=30000' >> "$GITHUB_OUTPUT" ;;
            m) echo 'args=--sessions=10000 --observations-per-session=100 --startup-mode=clean --timeout-ms=60000' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
      - name: Run Daemon startup benchmark
        shell: bash
        run: |
          mkdir -p performance-artifacts
          npm run perf:daemon-startup -- ${{ steps.profile.outputs.args }} | tee performance-artifacts/daemon-startup-${{ steps.profile.outputs.profile }}.txt
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-performance-daemon-startup-${{ steps.profile.outputs.profile }}
          path: performance-artifacts/
          if-no-files-found: error
