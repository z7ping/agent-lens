name: Windows Installer Compile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify desktop shell syntax
        run: npm run check:desktop-shell

      - name: Build distributable
        run: npm run build:dist

      - name: Prepare Windows desktop runtime
        run: npm run desktop:prepare

      - name: Compile NSIS installer
        run: npm run dist:win --workspace @agent-lens/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有生成 Windows NSIS 安装器' }
          Write-Host "Installer: $($installer.FullName)"

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'release/windows/AgentLens-*-Setup-x64.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw '没有生成 Windows NSIS 安装器' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content release/windows/SHA256SUMS-windows.txt

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lens-windows-unsigned-${{ github.run_id }}
          path: |
            release/windows/AgentLens-*-Setup-x64.exe
            release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
