name: 临时 Daemon 启动 S M 实测

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-daemon-startup-s-m.yml'

permissions:
  contents: read

jobs:
  startup-s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: S 级启动实测
        run: npm run perf:daemon-startup -- --sessions=1000 --observations-per-session=100 --startup-mode=cycle --timeout-ms=30000

  startup-m:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: M 级干净启动实测
        run: npm run perf:daemon-startup -- --sessions=10000 --observations-per-session=100 --startup-mode=clean --timeout-ms=60000
