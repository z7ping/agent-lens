name: Temp Alpha3 Task Execution Contract

on:
  push:
    branches:
      - bugfix/alpha3-task-execution-contract
    paths:
      - .github/workflows/tmp-alpha3-task-execution-contract.yml

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/alpha3-task-execution-contract
      - name: Update TaskExecution contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/check-pi-live-contract.mjs'
          let source = fs.readFileSync(path, 'utf8')
          function replace(before, after, label) {
            if (!source.includes(before)) throw new Error(`missing ${label}`)
            source = source.replace(before, after)
          }
          replace(
            'const [app, taskCenter, taskSurface, taskHeader, taskMessage, taskRound, taskDetailModel, taskCenterCss, taskHeaderCss, reviewPage, page, hubPage, history, client, css, http, runtime, sdkLoader, sdkAdapter, runtimePackage, coreObservation, timelineProtocol] = await Promise.all([',
            'const [app, taskCenter, taskSurface, taskHeader, taskMessage, taskRound, taskThinking, taskToolGroup, taskToolRow, taskDetailModel, taskCenterCss, taskHeaderCss, reviewPage, page, hubPage, history, client, css, http, runtime, sdkLoader, sdkAdapter, runtimePackage, coreObservation, timelineProtocol] = await Promise.all([',
            'contract inputs',
          )
          replace(
            "  readFile(new URL('../packages/web/src/features/TaskRound.tsx', import.meta.url), 'utf8'),\n  readFile(new URL('../packages/web/src/features/task-detail-model.ts', import.meta.url), 'utf8'),",
            "  readFile(new URL('../packages/web/src/features/TaskRound.tsx', import.meta.url), 'utf8'),\n  readFile(new URL('../packages/web/src/features/TaskThinking.tsx', import.meta.url), 'utf8'),\n  readFile(new URL('../packages/web/src/features/TaskToolGroup.tsx', import.meta.url), 'utf8'),\n  readFile(new URL('../packages/web/src/features/TaskToolRow.tsx', import.meta.url), 'utf8'),\n  readFile(new URL('../packages/web/src/features/task-detail-model.ts', import.meta.url), 'utf8'),",
            'contract reads',
          )
          replace(
            "if (/function Interaction\\(/.test(reviewPage)) failures.push('Review 不得继续保留旧 Interaction 轮次外壳；应由 TaskRound 承载')\n\nrequireText(taskMessage,",
            "if (/function Interaction\\(/.test(reviewPage)) failures.push('Review 不得继续保留旧 Interaction 轮次外壳；应由 TaskRound 承载')\n\nrequireText(taskDetailModel, /export interface TaskThinkingModel/, '统一 TaskThinkingModel 缺失')\nrequireText(taskDetailModel, /export interface TaskToolGroupModel/, '统一 TaskToolGroupModel 缺失')\nrequireText(taskDetailModel, /export interface TaskToolModel/, '统一 TaskToolModel 缺失')\nrequireText(taskThinking, /export function TaskThinking/, '统一 TaskThinking 组件缺失')\nrequireText(taskThinking, /thinking-block/, 'TaskThinking 必须保持执行轨 Thinking 视觉语义')\nrequireText(taskToolGroup, /export function TaskToolGroup/, '统一 TaskToolGroup 组件缺失')\nrequireText(taskToolGroup, /<TaskToolRow/, 'TaskToolGroup 必须统一通过 TaskToolRow 渲染单工具')\nrequireText(taskToolRow, /export function TaskToolRow/, '统一 TaskToolRow 组件缺失')\nrequireText(taskToolRow, /<ToolKindIcon kind=\\{model\\.kind\\}/, 'TaskToolRow 必须使用语义 ToolKindIcon，不得退回通用占位图标')\nrequireText(reviewPage, /import \\{ TaskThinking \\} from '\\.\\/TaskThinking'/, 'Review Reasoning 必须接入 TaskThinking')\nrequireText(reviewPage, /return <TaskThinking[\\s\\S]{0,900}<MarkdownSurface/, 'Review Reasoning 必须由 TaskThinking 承载并保留 Markdown')\nrequireText(reviewPage, /import \\{ TaskToolGroup \\} from '\\.\\/TaskToolGroup'/, 'Review Tool Group 必须接入 TaskToolGroup')\nrequireText(reviewPage, /function ReviewToolGroupAdapter[\\s\\S]{0,1800}<TaskToolGroup/, 'Review Tool 必须经 Adapter 投影到 TaskToolGroup')\nif (/function ToolRow\\(/.test(reviewPage) || /function ToolRunGroup\\(/.test(reviewPage)) failures.push('Review 不得继续维护旧 ToolRow / ToolRunGroup 组件副本')\n\nrequireText(taskMessage,",
            'TaskExecution checks',
          )
          replace(
            "console.log('Pi Live / 任务中心契约检查通过：统一 TaskSurface、TaskHeader、TaskMessage、TaskDetailModel、TaskRound、任务中心历史筛选栏、嵌入态详情、官方 Pi SDK 类型适配与 capability 校验、活跃任务列举、项目上下文启动、事件层级、历史事实、IME、Stop/Terminate、滚动跟随、Extension UI、背压与性能诊断已锁定。')",
            "console.log('Pi Live / 任务中心契约检查通过：统一 TaskSurface、TaskHeader、TaskMessage、TaskDetailModel、TaskRound、TaskThinking、TaskToolGroup、TaskToolRow、任务中心历史筛选栏、嵌入态详情、官方 Pi SDK 类型适配与 capability 校验、活跃任务列举、项目上下文启动、事件层级、历史事实、IME、Stop/Terminate、滚动跟随、Extension UI、背压与性能诊断已锁定。')",
            'contract summary',
          )
          fs.writeFileSync(path, source)
          NODE
      - name: Commit contract
        shell: bash
        run: |
          git config user.name "7ping"
          git config user.email "z7ping@outlook.com"
          git add scripts/check-pi-live-contract.mjs
          git diff --cached --check
          git commit -m "test: 锁定 TaskThinking 与 TaskTool 共享边界"
          git push origin HEAD:bugfix/alpha3-task-execution-contract
