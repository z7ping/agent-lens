name: 临时执行 Source 扫描性能修改

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-run-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 应用修改
        run: python .github/_tmp_source_scan_patch.py
      - name: 检查并提交
        run: |
          git config user.name 'agentlens-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/source-pi/src/index.ts apps/daemon/src/sources/dsh.ts
          git diff --cached --check
          git commit -m '优化 Pi 实时采集与 DSH 历史扫描'
          git push origin HEAD:main
