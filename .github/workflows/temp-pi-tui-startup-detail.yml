name: Temporary Pi TUI Startup Detail

on:
  push:
    branches:
      - automation/pi-tui-startup-detail-20260903

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/pi-tui-startup-detail-20260903
      - name: Preserve and fix patch script
        shell: bash
        run: |
          cp .github/scripts/apply-pi-tui-startup-detail.py /tmp/apply-pi-tui-startup-detail.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-pi-tui-startup-detail.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(path: str, old: str, new: str) -> None:\n    source = read(path)\n    count = source.count(old)\n    if count != 1:\n        raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")\n    write(path, source.replace(old, new, 1))\n'''
          new = '''def replace_once(path: str, old: str, new: str) -> None:\n    source = read(path)\n    count = source.count(old)\n    if count < 1:\n        raise SystemExit(f"{path}: expected at least one match, got {count}: {old[:120]!r}")\n    duplicate_ready_state = old.startswith("      initializationTimings: runtime.initializationTimings,")\n    if count > 1 and not duplicate_ready_state:\n        raise SystemExit(f"{path}: ambiguous patch target, got {count}: {old[:120]!r}")\n    write(path, source.replace(old, new, 1))\n'''
          if old not in text:
              raise SystemExit('replace_once protection block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Checkout latest feature branch
        run: |
          git fetch origin feature/1.0.0-alpha.3-task-surface
          git checkout -B feature/1.0.0-alpha.3-task-surface origin/feature/1.0.0-alpha.3-task-surface
      - name: Apply Pi TUI startup detail
        run: python /tmp/apply-pi-tui-startup-detail.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/protocol/src/pi-live.ts \
            packages/runtime-cordis/src/pi-live/types.ts \
            packages/runtime-cordis/src/pi-live/worker-host.ts \
            packages/runtime-cordis/src/pi-live/worker-entry.mjs \
            packages/runtime-cordis/src/pi-live/service.ts \
            packages/web/src/features/PiLivePage.tsx \
            packages/web/src/components/PiStartupDisclosure.tsx \
            packages/web/src/components/pi-startup-disclosure.css \
            packages/web/src/features/pi-startup-observability.test.ts
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "feat(pi): 展示 TUI 对齐的启动资源与扩展输出"
          git push origin HEAD:feature/1.0.0-alpha.3-task-surface
