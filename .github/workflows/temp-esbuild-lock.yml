name: Temporary esbuild lock refresh

on:
  push:
    branches: [fix/esbuild-sbom]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/temp-esbuild-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/esbuild-sbom

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install and SBOM
        run: |
          npm ci --no-audit --no-fund
          npm sbom --sbom-format cyclonedx > /tmp/agentlens-sbom.cdx.json
          npm run typecheck
          npm run build:dist

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: 更新 esbuild 锁文件'
          git push origin HEAD:fix/esbuild-sbom
