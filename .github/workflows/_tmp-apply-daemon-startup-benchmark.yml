name: 临时 Daemon 启动基准收口

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-apply-daemon-startup-benchmark.yml'
      - '.github/_tmp_daemon_startup_benchmark_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: 应用修改
        run: python .github/_tmp_daemon_startup_benchmark_patch.py
      - name: 类型检查
        run: npm run typecheck
      - name: 启动基准烟测
        run: npm run perf:daemon-startup -- --sessions=100 --observations-per-session=20 --startup-mode=cycle --timeout-ms=30000
      - name: 提交并清理临时脚手架
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/_tmp_daemon_startup_benchmark_patch.py .github/workflows/_tmp-apply-daemon-startup-benchmark.yml
          git add scripts/performance/daemon-startup-benchmark.ts package.json .github/workflows/performance.yml
          git diff --cached --check
          git commit -m 'perf: 将 Daemon 启动纳入正式性能基准'
          git push origin HEAD:main
