name: 临时 Source 性能最终收口

on:
  push:
    branches: [main]
    paths:
      - '.github/_tmp_finalize_source_perf.py'
      - '.github/workflows/_tmp-finalize-source-perf.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 执行最终收口
        run: python .github/_tmp_finalize_source_perf.py
      - name: 提交源码和文档
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/_tmp_finalize_source_perf.py
          git add packages/source-claude/src/index.ts docs/1.0/PERFORMANCE-BASELINE.md
          git diff --cached --check
          git commit -m 'perf: 收口 Source 历史扫描性能'
          git push origin HEAD:main
